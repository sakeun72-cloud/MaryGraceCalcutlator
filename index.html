<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Data</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>.hidden{display:none!important} input,textarea{color:#000!important; font-weight:600} input::placeholder{color:#999; font-weight:400} </style>
</head>
<body class="bg-[#f6f5f2] p-4">
<div class="bg-white rounded-xl p-4 mb-4">
  <div class="flex flex-wrap justify-between items-center gap-3">
    <h1 class="text-2xl font-bold"><span id="title-en">Product Data</span><span id="title-tl" class="hidden">Data ng Produkto</span><span id="title-de" class="hidden">Artikel Daten</span></h1>
    <div class="flex bg-zinc-100 rounded-full p-1">
      <button onclick="setLang('EN')" id="btn-en" class="px-4 py-1.5 rounded-full text-sm bg-black text-white">EN</button>
      <button onclick="setLang('TL')" id="btn-tl" class="px-4 py-1.5 rounded-full text-sm">TL</button>
      <button onclick="setLang('DE')" id="btn-de" class="px-4 py-1.5 rounded-full text-sm">DE</button>
    </div>
  </div>
  <div class="flex flex-wrap gap-2 mt-3 border-t pt-3">
    <button onclick="testConnection()" class="bg-black text-white px-4 py-1.5 rounded-full text-xs">Test Connection</button>
    <button onclick="saveCurrent()" class="bg-green-500 text-black px-6 py-2 rounded-full text-sm font-black border-2 border-black"><span id="save-en">💾 SAVE TO SERVER</span><span id="save-tl" class="hidden">💾 I-SAVE SA SERVER</span><span id="save-de" class="hidden">💾 AUF SERVER SPEICHERN</span></button>
    <button onclick="loadFromSupabase()" class="bg-white border px-4 py-1.5 rounded-full text-xs">🔄 Reload Supabase</button>
    <button onclick="window.open('Layout.html','_blank')" class="bg-amber-100 border px-4 py-2 rounded-full text-xs font-bold">📘 Facebook Studio</button>
    <span id="sb-status" class="text-xs">⏳ Verbinde...</span>
  </div>
</div>

<div class="grid grid-cols-12 gap-4">
  <div class="col-span-12 lg:col-span-3 bg-white rounded-xl p-4 h-fit">
    <div class="flex justify-between mb-3"><b>Articles</b><button onclick="newArticle()" class="bg-black text-white px-3 py-1 rounded-full text-xs">+ New</button></div>
    <div id="list"></div>
  </div>
  <div class="col-span-12 lg:col-span-9 bg-white rounded-xl p-4">
    <div id="form" class="text-center py-10 text-zinc-400">Kein Artikel gewählt - links wählen oder + New</div>
  </div>
</div>

<script>
const SUPABASE_URL="https://crdtuptjybxbsezxtksp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_GU6AAlF0zc3LB4hFlKK0fw_TNxo9z7q";
let lang=localStorage.getItem('lang')||'EN';
let articles=JSON.parse(localStorage.getItem('marygrace_server_cache')||'[]');
if(articles.length===0){ articles=JSON.parse(localStorage.getItem('kingfields_full_v3')||'[]'); }
let current=null;
let sbClient=null;
let bildSackBase64=''; let bildReisBase64='';

try{ sbClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY); document.getElementById('sb-status').textContent='✅ Client OK'; }catch(e){ document.getElementById('sb-status').textContent='❌ '+e.message; }

function setLang(l){
  lang=l; localStorage.setItem('lang',l);
  document.getElementById('btn-en').className=l==='EN'?'px-4 py-1.5 rounded-full text-sm bg-black text-white':'px-4 py-1.5 rounded-full text-sm';
  document.getElementById('btn-tl').className=l==='TL'?'px-4 py-1.5 rounded-full text-sm bg-black text-white':'px-4 py-1.5 rounded-full text-sm';
  document.getElementById('btn-de').className=l==='DE'?'px-4 py-1.5 rounded-full text-sm bg-black text-white':'px-4 py-1.5 rounded-full text-sm';
  document.getElementById('title-en').classList.toggle('hidden',l!=='EN');
  document.getElementById('title-tl').classList.toggle('hidden',l!=='TL');
  document.getElementById('title-de').classList.toggle('hidden',l!=='DE');
  document.getElementById('save-en').classList.toggle('hidden',l!=='EN');
  document.getElementById('save-tl').classList.toggle('hidden',l!=='TL');
  document.getElementById('save-de').classList.toggle('hidden',l!=='DE');
  if(current) renderForm();
}
async function loadFromSupabase(){
  const el=document.getElementById('sb-status'); el.textContent='⏳ Lade...';
  try{
    const {data,error}=await sbClient.from('stammdaten').select('*').order('artikelnummer');
    if(error) throw error;
    if(!data||data.length===0){ el.textContent='⚠️ Supabase leer'; if(articles.length>0) renderList(); return; }
    articles=data.map(d=>{
      const m=d.marketing||{}; const en=m.en||{}; const tl=m.tl||{}; const de=m.de||{};
      return {
        id:d.artikelnummer, artikelnummer:d.artikelnummer, nameKurz:d.name_kurz||'', nameLang:d.name_lang||'', marke:d.marke||'', sorte:d.sorte||'', herkunft:d.herkunft||'', gewicht:d.gewicht||'', einheit:d.einheit||'kg', qualitaet:d.qualitaet||'', erntejahr:d.erntejahr||'',
        bullet1En:en.bullet1||'', bullet1Tl:tl.bullet1||'', bullet1De:de.bullet1||'',
        bullet2En:en.bullet2||'', bullet2Tl:tl.bullet2||'', bullet2De:de.bullet2||'',
        bullet3En:en.bullet3||'', bullet3Tl:tl.bullet3||'', bullet3De:de.bullet3||'',
        bullet4En:en.bullet4||'', bullet4Tl:tl.bullet4||'', bullet4De:de.bullet4||'',
        bullet5En:en.bullet5||'', bullet5Tl:tl.bullet5||'', bullet5De:de.bullet5||'',
        geschmackEn:en.geschmack||'', geschmackTl:tl.geschmack||'', geschmackDe:de.geschmack||'',
        aromaEn:en.aroma||'', aromaTl:tl.aroma||'', aromaDe:de.aroma||'',
        texturEn:en.textur||'', texturTl:tl.textur||'', texturDe:de.textur||'',
        passtZuEn:en.passtZu||'', passtZuTl:tl.passtZu||'', passtZuDe:de.passtZu||'',
        kochmethodeEn:en.kochmethode||'', kochmethodeTl:tl.kochmethode||'', kochmethodeDe:de.kochmethode||'',
        sloganEn:en.slogan||'', sloganTl:tl.slogan||'', sloganDe:de.slogan||'',
        shortEn:en.short||'', shortTl:tl.short||'', shortDe:de.short||'',
        storyEn:en.story||'', storyTl:tl.story||'', storyDe:de.story||'',
        bildSackUrl:d.bild_sack_url||'', bildReisUrl:d.bild_reis_url||''
      };
    });
    localStorage.setItem('marygrace_server_cache', JSON.stringify(articles));
    el.textContent='✅ '+articles.length+' aus Supabase';
    renderList(); if(articles.length>0 && !current) openArticle(articles[0].id);
  }catch(e){ el.textContent='❌ '+e.message; console.error(e); renderList(); }
}
function renderList(){
  const el=document.getElementById('list');
  if(articles.length===0){ el.innerHTML='<div class="text-xs text-zinc-400 py-5 text-center">Keine Artikel<br><button onclick="newArticle()" class="mt-2 bg-black text-white px-3 py-1 rounded-full">+ Ersten erstellen</button></div>'; document.getElementById('form').innerHTML='<div class="text-center py-10 text-zinc-400">Keine Artikel - klick + New</div>'; return; }
  el.innerHTML=articles.map(a=>`<div onclick="openArticle('${a.id}')" class="p-2 border rounded-xl mb-2 cursor-pointer hover:bg-zinc-50 ${current&&current.id===a.id?'bg-black text-white':''}"><div class="text-xs font-bold">${a.artikelnummer}</div><div class="text-sm">${a.nameKurz||'ohne Name'}</div></div>`).join('');
}
function openArticle(id){
  current=articles.find(a=>a.id===id);
  if(!current) return;
  bildSackBase64=''; bildReisBase64='';
  renderList(); renderForm();
}
function newArticle(){
  const nr=String(articles.length+1).padStart(3,'0');
  current={ id:Date.now().toString(), artikelnummer:nr, nameKurz:'', nameLang:'', marke:'Kingfields', sorte:'', qualitaet:'Premium', herkunft:'Thailand', erntejahr:'2025', gewicht:'5', einheit:'kg', bullet1En:'', bullet1Tl:'', bullet1De:'', bullet2En:'', bullet2Tl:'', bullet2De:'', bullet3En:'', bullet3Tl:'', bullet3De:'', bullet4En:'', bullet4Tl:'', bullet4De:'', bullet5En:'', bullet5Tl:'', bullet5De:'', geschmackEn:'', geschmackTl:'', geschmackDe:'', aromaEn:'', aromaTl:'', aromaDe:'', texturEn:'', texturTl:'', texturDe:'', passtZuEn:'', passtZuTl:'', passtZuDe:'', kochmethodeEn:'', kochmethodeTl:'', kochmethodeDe:'', sloganEn:'', sloganTl:'', sloganDe:'', shortEn:'', shortTl:'', shortDe:'', storyEn:'', storyTl:'', storyDe:'', bildSackUrl:'', bildReisUrl:'' };
  articles.unshift(current);
  renderList(); renderForm();
}
function val(f){
  if(!current) return '';
  if(lang==='EN') return current[f+'En']||'';
  if(lang==='TL') return current[f+'Tl']||'';
  return current[f+'De']||'';
}
function renderForm(){
  if(!current){ document.getElementById('form').innerHTML='Kein Artikel'; return; }
  document.getElementById('form').innerHTML=`
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div><label class="text-xs">Artikelnummer</label><input id="f-artikelnummer" value="${current.artikelnummer||''}" class="w-full border border-zinc-900 rounded-full px-3 py-2 text-sm font-bold text-black bg-white"></div>
      <div><label class="text-xs">Name Kurz</label><input id="f-nameKurz" value="${current.nameKurz||''}" class="w-full border border-zinc-900 rounded-full px-3 py-2 text-sm font-bold text-black bg-white"></div>
      <div><label class="text-xs">Marke</label><input id="f-marke" value="${current.marke||''}" class="w-full border border-zinc-900 rounded-full px-3 py-2 text-sm font-bold text-black bg-white"></div>
      <div><label class="text-xs">Sorte</label><input id="f-sorte" value="${current.sorte||''}" class="w-full border border-zinc-900 rounded-full px-3 py-2 text-sm font-bold text-black bg-white"></div>
      <div><label class="text-xs">Herkunft</label><input id="f-herkunft" value="${current.herkunft||''}" class="w-full border border-zinc-900 rounded-full px-3 py-2 text-sm font-bold text-black bg-white"></div>
      <div><label class="text-xs">Gewicht</label><input id="f-gewicht" value="${current.gewicht||''}" class="w-full border border-zinc-900 rounded-full px-3 py-2 text-sm font-bold text-black bg-white"></div>
    </div>
    <div class="bg-green-50 border-2 border-green-300 rounded-xl p-4 mb-4">
      <h3 class="font-bold text-sm mb-2">Bullets • ${lang} • 5 Stück</h3>
      <input id="f-bullet1" value="${val('bullet1')}" placeholder="Bullet 1" class="w-full border rounded-full px-3 py-2 text-sm mb-2">
      <input id="f-bullet2" value="${val('bullet2')}" placeholder="Bullet 2" class="w-full border rounded-full px-3 py-2 text-sm mb-2">
      <input id="f-bullet3" value="${val('bullet3')}" placeholder="Bullet 3" class="w-full border rounded-full px-3 py-2 text-sm mb-2">
      <input id="f-bullet4" value="${val('bullet4')}" placeholder="Bullet 4" class="w-full border rounded-full px-3 py-2 text-sm mb-2">
      <input id="f-bullet5" value="${val('bullet5')}" placeholder="Bullet 5" class="w-full border border-zinc-900 rounded-full px-3 py-2 text-sm font-bold text-black bg-white">
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
      <div><label class="text-xs">Geschmack • ${lang}</label><input id="f-geschmack" value="${val('geschmack')}" class="w-full border border-zinc-900 rounded-full px-3 py-2 text-sm font-bold text-black bg-white"></div>
      <div><label class="text-xs">Aroma • ${lang}</label><input id="f-aroma" value="${val('aroma')}" class="w-full border border-zinc-900 rounded-full px-3 py-2 text-sm font-bold text-black bg-white"></div>
      <div><label class="text-xs">Textur • ${lang}</label><input id="f-textur" value="${val('textur')}" class="w-full border border-zinc-900 rounded-full px-3 py-2 text-sm font-bold text-black bg-white"></div>
      <div><label class="text-xs">Passt zu • ${lang}</label><input id="f-passtZu" value="${val('passtZu')}" class="w-full border border-zinc-900 rounded-full px-3 py-2 text-sm font-bold text-black bg-white"></div>
      <div><label class="text-xs">Slogan • ${lang}</label><input id="f-slogan" value="${val('slogan')}" class="w-full border border-zinc-900 rounded-full px-3 py-2 text-sm font-bold text-black bg-white"></div>
      <div><label class="text-xs">Kochmethode • ${lang}</label><input id="f-kochmethode" value="${val('kochmethode')}" class="w-full border border-zinc-900 rounded-full px-3 py-2 text-sm font-bold text-black bg-white"></div>
    </div>
    <div class="mb-4"><label class="text-xs">Short • ${lang}</label><textarea id="f-short" class="w-full border border-zinc-900 rounded-xl px-3 py-2 text-sm font-bold text-black bg-white">${val('short')}</textarea></div>
    <div class="mb-4"><label class="text-xs">Story • ${lang}</label><textarea id="f-story" class="w-full border border-zinc-900 rounded-xl px-3 py-2 text-sm font-bold text-black bg-white">${val('story')}</textarea></div>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="border rounded-xl p-3">
        <label class="text-xs font-bold">Bild Sack</label>
        <div class="mt-2 w-full h-[150px] border rounded-xl bg-zinc-50 flex items-center justify-center overflow-hidden">
          ${current.bildSackUrl?`<img src="${current.bildSackUrl}" class="max-h-[140px] object-contain">`:`<span class="text-xs text-zinc-400">Kein Bild</span>`}
        </div>
        <div id="preview-sack" class="mt-2 hidden"><div class="text-xs font-bold">Neue Vorschau:</div><img id="preview-sack-img" class="max-h-[100px] border rounded"></div>
        <input id="f-bildSack" value="${current.bildSackUrl||''}" class="w-full border rounded-full px-2 py-1 text-xs mt-2" placeholder="URL oder leer lassen">
        <input type="file" accept="image/*" onchange="handleSack(this)" class="text-xs mt-2 w-full">
      </div>
      <div class="border rounded-xl p-3">
        <label class="text-xs font-bold">Bild Reis (rund)</label>
        <div class="mt-2 w-full h-[150px] border rounded-xl bg-zinc-50 flex items-center justify-center overflow-hidden">
          ${current.bildReisUrl?`<img src="${current.bildReisUrl}" class="max-h-[140px] object-contain">`:`<span class="text-xs text-zinc-400">Kein Bild</span>`}
        </div>
        <div id="preview-reis" class="mt-2 hidden"><div class="text-xs font-bold">Neue Vorschau:</div><img id="preview-reis-img" class="max-h-[100px] border rounded"></div>
        <input id="f-bildReis" value="${current.bildReisUrl||''}" class="w-full border rounded-full px-2 py-1 text-xs mt-2" placeholder="URL oder leer lassen">
        <input type="file" accept="image/*" onchange="handleReis(this)" class="text-xs mt-2 w-full">
      </div>
    </div>
    <div class="flex gap-2"><button onclick="saveCurrent()" class="flex-1 bg-black text-white py-3 rounded-full font-bold">💾 SAVE / SPEICHERN</button><button onclick="deleteCurrent()" class="bg-red-50 border px-4 py-2 rounded-full text-xs">Delete</button></div>
  `;
}
function handleSack(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{ bildSackBase64=e.target.result; document.getElementById('preview-sack').classList.remove('hidden'); document.getElementById('preview-sack-img').src=e.target.result; document.getElementById('sb-status').textContent='📸 Neues Sack Bild bereit - klick SAVE'; }; r.readAsDataURL(f); }
function handleReis(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{ bildReisBase64=e.target.result; document.getElementById('preview-reis').classList.remove('hidden'); document.getElementById('preview-reis-img').src=e.target.result; document.getElementById('sb-status').textContent='📸 Neues Reis Bild bereit - klick SAVE'; }; r.readAsDataURL(f); }
async function saveCurrent(){
  if(!current) { alert('Kein Artikel'); return; }
  const fields=['artikelnummer','nameKurz','marke','sorte','herkunft','gewicht'];
  fields.forEach(f=>{ const el=document.getElementById('f-'+f); if(el) current[f]=el.value; });
  const langFields=['bullet1','bullet2','bullet3','bullet4','bullet5','geschmack','aroma','textur','passtZu','kochmethode','slogan','short','story'];
  langFields.forEach(f=>{ const el=document.getElementById('f-'+f); if(el){ if(lang==='EN') current[f+'En']=el.value; else if(lang==='TL') current[f+'Tl']=el.value; else current[f+'De']=el.value; } });
  const bSack=document.getElementById('f-bildSack'); if(bSack) current.bildSackUrl=bSack.value;
  const bReis=document.getElementById('f-bildReis'); if(bReis) current.bildReisUrl=bReis.value;
  // Save local
  const idx=articles.findIndex(a=>a.id===current.id);
  if(idx>=0) articles[idx]=current; else articles.unshift(current);
  localStorage.setItem('marygrace_server_cache', JSON.stringify(articles));
  localStorage.setItem('kingfields_full_v3', JSON.stringify(articles));
  document.getElementById('sb-status').textContent='⏳ Speichere auf Server...';
  try{
    let sackUrl=current.bildSackUrl||''; let reisUrl=current.bildReisUrl||'';
    // Fester Dateiname nach Artikelnummer - überschreibt immer! Erkennt PNG/JPG
    if(bildSackBase64){
      const blob=await (await fetch(bildSackBase64)).blob();
      let ext='jpg';
      if(blob.type.includes('png')) ext='png';
      else if(blob.type.includes('webp')) ext='webp';
      else if(blob.type.includes('jpeg')||blob.type.includes('jpg')) ext='jpg';
      // Immer als jpg speichern - konvertiert automatisch durch Blob, aber behalte ext für URL
      // Wir speichern beide Varianten löschend: erst alte Varianten löschen, dann neue hochladen
      const basePath=`${current.artikelnummer}_sack`;
      // Versuche alte Dateien zu überschreiben - speichere immer als jpg für Einheitlichkeit
      const path=`${basePath}.jpg`;
      const {error}=await sbClient.storage.from('produktbilder').upload(path, blob, {upsert:true, contentType: 'image/jpeg'});
      if(!error){
        const {data}=sbClient.storage.from('produktbilder').getPublicUrl(path);
        sackUrl=data.publicUrl.split('?')[0] + '?t=' + Date.now();
        document.getElementById('sb-status').textContent='✅ Sack Bild '+path+' (Artikel '+current.artikelnummer+' Hauptbild) gespeichert!';
      } else {
        document.getElementById('sb-status').textContent='❌ Sack Upload: '+error.message;
        console.error(error);
      }
    }
    if(bildReisBase64){
      const blob=await (await fetch(bildReisBase64)).blob();
      const basePath=`${current.artikelnummer}_reis`;
      const path=`${basePath}.jpg`;
      const {error}=await sbClient.storage.from('produktbilder').upload(path, blob, {upsert:true, contentType: 'image/jpeg'});
      if(!error){
        const {data}=sbClient.storage.from('produktbilder').getPublicUrl(path);
        reisUrl=data.publicUrl.split('?')[0] + '?t=' + Date.now();
        document.getElementById('sb-status').textContent='✅ Reis Bild '+path+' (Artikel '+current.artikelnummer+' Detailbild) gespeichert!';
      } else {
        document.getElementById('sb-status').textContent='❌ Reis Upload: '+error.message;
        console.error(error);
      }
    }
    const payload={
      artikelnummer:current.artikelnummer, name_kurz:current.nameKurz, marke:current.marke, sorte:current.sorte, herkunft:current.herkunft, gewicht:current.gewicht, einheit:current.einheit, qualitaet:current.qualitaet, erntejahr:current.erntejahr,
      bild_sack_url:sackUrl, bild_reis_url:reisUrl,
      marketing:{ en:{ bullet1:current.bullet1En, bullet2:current.bullet2En, bullet3:current.bullet3En, bullet4:current.bullet4En, bullet5:current.bullet5En, geschmack:current.geschmackEn, aroma:current.aromaEn, textur:current.texturEn, passtZu:current.passtZuEn, kochmethode:current.kochmethodeEn, slogan:current.sloganEn, short:current.shortEn, story:current.storyEn }, tl:{ bullet1:current.bullet1Tl, bullet2:current.bullet2Tl, bullet3:current.bullet3Tl, bullet4:current.bullet4Tl, bullet5:current.bullet5Tl, geschmack:current.geschmackTl, aroma:current.aromaTl, textur:current.texturTl, passtZu:current.passtZuTl, kochmethode:current.kochmethodeTl, slogan:current.sloganTl, short:current.shortTl, story:current.storyTl }, de:{ bullet1:current.bullet1De, bullet2:current.bullet2De, bullet3:current.bullet3De, bullet4:current.bullet4De, bullet5:current.bullet5De, geschmack:current.geschmackDe, aroma:current.aromaDe, textur:current.texturDe, passtZu:current.passtZuDe, kochmethode:current.kochmethodeDe, slogan:current.sloganDe, short:current.shortDe, story:current.storyDe } }
    };
    const {error}=await sbClient.from('stammdaten').upsert(payload,{onConflict:'artikelnummer'});
    if(error) throw error;
    document.getElementById('sb-status').textContent='✅ Gespeichert auf Server!';
    bildSackBase64=''; bildReisBase64='';
  }catch(e){ document.getElementById('sb-status').textContent='❌ '+e.message; console.error(e); }
  renderList();
}
function deleteCurrent(){ if(!current) return; if(!confirm('Delete?')) return; articles=articles.filter(a=>a.id!==current.id); localStorage.setItem('marygrace_server_cache', JSON.stringify(articles)); current=null; renderList(); document.getElementById('form').innerHTML='Gelöscht'; }
async function testConnection(){ try{ const {data,error}=await sbClient.from('stammdaten').select('count'); if(error) throw error; document.getElementById('sb-status').textContent='✅ Verbindung OK'; }catch(e){ document.getElementById('sb-status').textContent='❌ '+e.message; } }

setLang(lang);
renderList();
loadFromSupabase();
</script>
</body>
</html>
