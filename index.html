<script>
document.addEventListener('DOMContentLoaded', function() {
  const check = setInterval(() => {
    const headers = document.querySelectorAll('header');
    headers.forEach(h => {
      // Remove any MG div
      h.querySelectorAll('div').forEach(d => {
        if (d.textContent.trim() === 'MG' || d.textContent.includes('MARY GRACE')) {
          if (d.offsetWidth < 300) d.style.display='none';
        }
      });
      h.querySelectorAll('img').forEach(i => {
        if (i.alt && i.alt.includes('MG')) i.style.display='none';
      });
      // Also hide logo container
      const logoContainers = h.querySelectorAll('[class*="w-9"],[class*="h-9"],[class*="w-10"]');
      logoContainers.forEach(c => c.style.display='none');
    });
    // Remove custom header if exists
    const custom = document.getElementById('custom-header');
    if (custom) custom.remove();
  }, 300);
  setTimeout(()=>clearInterval(check), 3000);
});
</script>

<script>
const openTabs = {};
function reuseTab(e, name) {
  e.preventDefault();
  const url = e.currentTarget.href;
  // If tab exists and not closed, focus it
  if (openTabs[name] && !openTabs[name].closed) {
    openTabs[name].location.href = url;
    openTabs[name].focus();
  } else {
    openTabs[name] = window.open(url, name);
  }
  return false;
}
</script>

<script>
(function(){
  function fixKurzname(){
    // Find the bubble with Mandi Bigas
    document.querySelectorAll('div').forEach(d=>{
      if(d.textContent && d.textContent.startsWith('Mandi Bigas') && d.offsetWidth < 300 && d.offsetHeight < 50){
        d.style.maxWidth='500px';
        d.style.minWidth='180px';
        d.style.width='auto';
        d.style.overflow='visible';
        d.style.whiteSpace='nowrap';
        d.style.textOverflow='clip';
        // Ensure parent not clipping
        if(d.parentElement){
          d.parentElement.style.overflow='visible';
          d.parentElement.style.maxWidth='600px';
        }
      }
    });
  }
  document.addEventListener('DOMContentLoaded', fixKurzname);
  setInterval(fixKurzname, 800);
})();
</script>
