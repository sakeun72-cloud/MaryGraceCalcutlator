<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wareneingangsbuch</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <h1 class="mb-4 text-center">Wareneingangsbuch</h1>

        <!-- Eingabeformular -->
        <div class="card shadow-sm mb-5">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Neuen Wareneingang erfassen</h5>
            </div>
            <div class="card-body">
                <form id="entryForm">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="date" class="form-label">Datum</label>
                            <input type="date" class="form-control" id="date" required>
                        </div>
                        <div class="col-md-4">
                            <label for="article" class="form-label">Artikel</label>
                            <select class="form-select" id="article" required>
                                <option value="" disabled selected>Bitte wählen...</option>
                                <option value="Fuji">Fuji</option>
                                <option value="Perfect">Perfect</option>
                                <option value="Master Aroma">Master Aroma</option>
                                <option value="Sweet Hasmin">Sweet Hasmin</option>
                                <option value="Coco pandan">Coco pandan</option>
                                <option value="Jasmine original">Jasmine original</option>
                                <option value="Master Alsa">Master Alsa</option>
                                <option value="Brown rice">Brown rice</option>
                                <option value="Malagkit/k">Malagkit/k</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="quantity" class="form-label">Menge</label>
                            <input type="number" class="form-control" id="quantity" min="1" step="1" required>
                        </div>
                        <div class="col-md-3">
                            <label for="price" class="form-label">Paketpreis (€)</label>
                            <input type="number" class="form-control" id="price" min="0.01" step="0.01" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success mt-3">Eingabe abschicken</button>
                </form>
            </div>
        </div>

        <!-- Auswertung nach Zeitraum -->
        <div class="card shadow-sm mb-5">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Auswertung nach Zeitraum</h5>
            </div>
            <div class="card-body">
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label for="startDate" class="form-label">Von Datum</label>
                        <input type="date" class="form-control" id="startDate">
                    </div>
                    <div class="col-md-4">
                        <label for="endDate" class="form-label">Bis Datum</label>
                        <input type="date" class="form-control" id="endDate">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button id="filterBtn" class="btn btn-outline-success w-100">Auswertung anzeigen</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Artikeltext</th>
                                <th>Gesamtmenge</th>
                                <th>Durchschnittspreis / Paket</th>
                                <th>Gesamtwert (€)</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody">
                            <tr>
                                <td colspan="4" class="text-center text-muted">Bitte Zeitraum wählen und auswerten.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Chronologisches Logbuch -->
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">Chronologisches Logbuch</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-sm table-bordered">
                        <thead>
                            <tr>
                                <th>Datum</th>
                                <th>Artikeltext</th>
                                <th>Menge</th>
                                <th>Preis / Paket</th>
                                <th>Aktion</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody">
                            <tr>
                                <td colspan="5" class="text-center text-muted">Noch keine Einträge vorhanden.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let entries = JSON.parse(localStorage.getItem('wareneingänge')) || [];
        document.getElementById('date').valueAsDate = new Date();

        document.getElementById('entryForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newEntry = {
                id: Date.now(),
                date: document.getElementById('date').value,
                article: document.getElementById('article').value,
                quantity: parseInt(document.getElementById('quantity').value),
                price: parseFloat(document.getElementById('price').value)
            };

            entries.push(newEntry);
            saveAndRefresh();
            
            // Felder zurücksetzen
            document.getElementById('article').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('price').value = '';
        });

        function saveAndRefresh() {
            localStorage.setItem('wareneingänge', JSON.stringify(entries));
            renderLog();
        }

        function renderLog() {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';
            if (entries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Noch keine Einträge vorhanden.</td></tr>';
                return;
            }
            const sortedEntries = [...entries].sort((a, b) => new Date(b.date) - new Date(a.date));
            sortedEntries.forEach(entry => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${entry.date}</td>
                    <td>${entry.article}</td>
                    <td>${entry.quantity}</td>
                    <td>${entry.price.toFixed(2)} €</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteEntry(${entry.id})">Löschen</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteEntry(id) {
            if (confirm('Eintrag löschen?')) {
                entries = entries.filter(entry => entry.id !== id);
                saveAndRefresh();
                document.getElementById('filterBtn').click();
            }
        }

        document.getElementById('filterBtn').addEventListener('click', function() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = '';

            let filtered = entries;
            if (startDate) filtered = filtered.filter(e => e.date >= startDate);
            if (endDate) filtered = filtered.filter(e => e.date <= endDate);

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Keine Wareneingänge gefunden.</td></tr>';
                return;
            }

            const aggregated = {};
            filtered.forEach(entry => {
                if (!aggregated[entry.article]) {
                    aggregated[entry.article] = { totalQty: 0, totalPriceSum: 0 };
                }
                aggregated[entry.article].totalQty += entry.quantity;
                aggregated[entry.article].totalPriceSum += (entry.price * entry.quantity);
            });

            for (const [article, data] of Object.entries(aggregated)) {
                const avgPrice = data.totalPriceSum / data.totalQty;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${article}</strong></td>
                    <td>${data.totalQty}</td>
                    <td>${avgPrice.toFixed(2)} €</td>
                    <td>${data.totalPriceSum.toFixed(2)} €</td>
                `;
                tbody.appendChild(tr);
            }
        });

        renderLog();
    </script>
</body>
</html>
