<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produktdaten & Supabase Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // Supabase Konfiguration
        const SUPABASE_URL = 'https://crdtuptjybxbsezxtksp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GU6AAlF0zc3LB4hFlKK0fw_TNxo9z7q';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [isOpen, setIsOpen] = React.useState(true);
            const [saving, setSaving] = React.useState(false);
            const [loading, setLoading] = React.useState(false);
            const [products, setProducts] = React.useState([]);
            const [formData, setFormData] = React.useState({
                name: '',
                beschreibung: '',
                preis: '',
                bestand: ''
            });

            // Daten laden
            const fetchProducts = async () => {
                setLoading(true);
                const { data, error } = await supabase.from('produktdaten').select('*');
                if (error) {
                    console.error('Fehler beim Laden:', error.message);
                } else {
                    setProducts(data || []);
                }
                setLoading(false);
            };

            React.useEffect(() => {
                fetchProducts();
            }, []);

            // Speichern / Upsert
            const handleSave = async () => {
                if (!formData.name) {
                    alert('Bitte mindestens einen Produktnamen eingeben.');
                    return;
                }
                setSaving(true);
                try {
                    const { data, error } = await supabase
                        .from('produktdaten')
                        .upsert([
                            {
                                name: formData.name,
                                beschreibung: formData.beschreibung,
                                preis: parseFloat(formData.preis) || 0,
                                bestand: parseInt(formData.bestand) || 0
                            }
                        ]);

                    if (error) throw error;
                    
                    alert('Erfolgreich auf dem Server gespeichert!');
                    setFormData({ name: '', beschreibung: '', preis: '', bestand: '' });
                    fetchProducts();
                } catch (err) {
                    console.error('Fehler beim Speichern:', err.message);
                    alert('Fehler beim Speichern: ' + err.message);
                } finally {
                    setSaving(false);
                }
            };

            return (
                <div className="max-w-4xl mx-auto p-6">
                    <header className="mb-8 flex justify-between items-center border-b pb-4">
                        <div>
                            <h1 className="text-2xl font-bold tracking-tight">Produktdaten & Supabase Manager</h1>
                            <p className="text-sm text-zinc-500">Komplettes Skript mit integrierten Supabase-Zugangsdaten und Speicher-Button.</p>
                        </div>
                        <button
                            onClick={() => setIsOpen(!isOpen)}
                            className="px-4 py-2 rounded-full bg-zinc-900 text-white text-xs font-medium hover:bg-zinc-800 transition-colors"
                        >
                            {isOpen ? 'Formular verbergen' : 'Formular anzeigen'}
                        </button>
                    </header>

                    {isOpen && (
                        <div className="bg-white rounded-2xl shadow-sm border border-zinc-200 p-6 mb-8">
                            <h2 className="text-lg font-semibold mb-4">Neues Produkt hinzufügen / Aktualisieren</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                <div>
                                    <label className="block text-xs font-medium text-zinc-700 mb-1">Produktname</label>
                                    <input
                                        type="text"
                                        value={formData.name}
                                        onChange={(e) => setFormData({...formData, name: e.target.value})}
                                        placeholder="z.B. Bio-Sack 50kg"
                                        className="w-full px-3 py-2 border border-zinc-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-zinc-700 mb-1">Preis (€)</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        value={formData.preis}
                                        onChange={(e) => setFormData({...formData, preis: e.target.value})}
                                        placeholder="0.00"
                                        className="w-full px-3 py-2 border border-zinc-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-zinc-700 mb-1">Bestand</label>
                                    <input
                                        type="number"
                                        value={formData.bestand}
                                        onChange={(e) => setFormData({...formData, bestand: e.target.value})}
                                        placeholder="0"
                                        className="w-full px-3 py-2 border border-zinc-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    />
                                </div>
                                <div className="md:col-span-2">
                                    <label className="block text-xs font-medium text-zinc-700 mb-1">Beschreibung</label>
                                    <textarea
                                        value={formData.beschreibung}
                                        onChange={(e) => setFormData({...formData, beschreibung: e.target.value})}
                                        placeholder="Details zum Produkt..."
                                        rows="3"
                                        className="w-full px-3 py-2 border border-zinc-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    ></textarea>
                                </div>
                            </div>

                            <div className="flex gap-2 items-center justify-end">
                                <button
                                    onClick={handleSave}
                                    disabled={saving}
                                    className="px-5 py-2.5 rounded-full bg-blue-600 hover:bg-blue-700 text-white text-[13px] font-medium transition-colors disabled:opacity-50 shadow-sm"
                                >
                                    {saving ? 'Speichere...' : 'Auf Server speichern'}
                                </button>
                                <button
                                    onClick={() => setIsOpen(false)}
                                    className="px-5 py-2.5 rounded-full bg-zinc-200 hover:bg-zinc-300 text-zinc-800 text-[13px] font-medium transition-colors"
                                >
                                    Schließen
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="bg-white rounded-2xl shadow-sm border border-zinc-200 p-6">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg font-semibold">Gespeicherte Produkte in Supabase</h2>
                            <button
                                onClick={fetchProducts}
                                className="text-xs text-blue-600 hover:underline font-medium"
                            >
                                Aktualisieren
                            </button>
                        </div>

                        {loading ? (
                            <p className="text-sm text-zinc-500 py-4 text-center">Lade Daten...</p>
                        ) : products.length === 0 ? (
                            <p className="text-sm text-zinc-500 py-4 text-center">Keine Einträge in der Tabelle `produktdaten` gefunden.</p>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead>
                                        <tr className="border-b border-zinc-200 text-zinc-500 text-xs uppercase tracking-wider">
                                            <th className="py-3 px-4">Name</th>
                                            <th className="p-3 px-4">Beschreibung</th>
                                            <th className="py-3 px-4">Preis</th>
                                            <th className="py-3 px-4">Bestand</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-zinc-100">
                                        {products.map((p, idx) => (
                                            <tr key={idx} className="hover:bg-zinc-50">
                                                <td className="py-3 px-4 font-medium">{p.name}</td>
                                                <td className="py-3 px-4 text-zinc-600">{p.beschreibung || '-'}</td>
                                                <td className="py-3 px-4">€ {p.preis}</td>
                                                <td className="py-3 px-4">{p.bestand}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>

                    <footer className="mt-8 text-center text-xs text-zinc-400">
                        Code sauber • Keine undefinierte Variable Settings • Alles in einer Datei
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
