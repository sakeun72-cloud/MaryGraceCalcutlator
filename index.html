<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cami Poco - Preisrechner</title>
    <!-- Tailwind CSS via CDN für modernes Design ohne Installationsaufwand -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="max-w-4xl mx-auto p-6 my-10 bg-white shadow-lg rounded-xl">
        <header class="border-b pb-4 mb-6">
            <h1 class="text-2xl font-bold text-indigo-600">Cami Poco - Interaktiver Rechner</h1>
            <p class="text-sm text-gray-500">Staffelpreise und mathematische Berechnungen für A, B und C</p>
        </header>
        
        <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Eingabebereich -->
            <div class="space-y-4">
                <h2 class="text-lg font-semibold text-gray-700">Mengen eingeben</h2>
                
                <!-- Produkt A -->
                <div class="p-4 bg-gray-50 rounded-lg border">
                    <label class="block font-medium text-sm text-gray-700">Menge Produkt A</label>
                    <input type="number" id="qtyA" value="1" min="0" class="mt-1 w-full p-2 border rounded-md focus:ring focus:ring-indigo-300">
                </div>

                <!-- Produkt B -->
                <div class="p-4 bg-gray-50 rounded-lg border">
                    <label class="block font-medium text-sm text-gray-700">Menge Produkt B</label>
                    <input type="number" id="qtyB" value="1" min="0" class="mt-1 w-full p-2 border rounded-md focus:ring focus:ring-indigo-300">
                </div>

                <!-- Produkt C -->
                <div class="p-4 bg-gray-50 rounded-lg border">
                    <label class="block font-medium text-sm text-gray-700">Menge Produkt C</label>
                    <input type="number" id="qtyC" value="1" min="0" class="mt-1 w-full p-2 border rounded-md focus:ring focus:ring-indigo-300">
                </div>

                <button onclick="calculate()" class="w-full bg-indigo-600 text-white p-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
                    Jetzt berechnen
                </button>
            </div>

            <!-- Ergebnisbereich -->
            <div class="bg-indigo-50 p-6 rounded-xl border border-indigo-100 flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold text-indigo-900 mb-4">Ergebnisse & Staffelpreise</h2>
                    <div id="results" class="space-y-3 text-sm text-indigo-800">
                        <p class="italic text-gray-500">Bitte Mengen eingeben und auf Berechnen klicken.</p>
                    </div>
                </div>
                <div class="mt-6 pt-4 border-t border-indigo-200 text-right font-bold text-lg text-indigo-900" id="totalSum">
                    Gesamt: 0,00 €
                </div>
            </div>
        </main>
    </div>

    <script>
        function calculate() {
            // Werte auslesen
            const qtyA = parseInt(document.getElementById('qtyA').value) || 0;
            const qtyB = parseInt(document.getElementById('qtyB').value) || 0;
            const qtyC = parseInt(document.getElementById('qtyC').value) || 0;

            // Beispiel-Logik für Staffelpreise (kann später angepasst werden)
            // Produkt A: 1-5 Stk = 10€, 6-10 Stk = 8€, ab 11 Stk = 6€
            let priceA = qtyA <= 5 ? 10 : (qtyA <= 10 ? 8 : 6);
            let totalA = qtyA * priceA;

            // Produkt B: 1-3 Stk = 15€, ab 4 Stk = 12€
            let priceB = qtyB <= 3 ? 15 : 12;
            let totalB = qtyB * priceB;

            // Produkt C: 1-5 Stk = 20€, ab 6 Stk = 18€
            let priceC = qtyC <= 5 ? 20 : 18;
            let totalC = qtyC * priceC;

            let sum = totalA + totalB + totalC;

            // Ausgabe generieren
            document.getElementById('results').innerHTML = `
                <div class="flex justify-between border-b pb-2"><span>Produkt A (${qtyA} Stk. à ${priceA} €):</span> <strong>${totalA.toFixed(2)} €</strong></div>
                <div class="flex justify-between border-b pb-2"><span>Produkt B (${qtyB} Stk. à ${priceB} €):</span> <strong>${totalB.toFixed(2)} €</strong></div>
                <div class="flex justify-between border-b pb-2"><span>Produkt C (${qtyC} Stk. à ${priceC} €):</span> <strong>${totalC.toFixed(2)} €</strong></div>
            `;
            document.getElementById('totalSuminnerText = `Gesamt: ${sum.toFixed(2)} €`; // (Hinweis im Code: innerText)
            document.getElementById('totalSum').innerText = `Gesamt: ${sum.toFixed(2)} €`;
        }
        
        // Initial einmal ausführen
        window.onload = calculate;
    </script>
</body>
</html>
