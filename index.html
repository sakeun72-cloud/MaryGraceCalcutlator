let navLinks = JSON.parse(localStorage.getItem('navLinks') || '[{"name":"Preisliste","url":"https://sakeun72-cloud.github.io/MaryGraceCalcutlator/Pricelist.html"},{"name":"Shop","url":"https://sakeun72-cloud.github.io/MaryGraceCalcutlator/Shop.html"},{"name":"Katalog","url":"https://sakeun72-cloud.github.io/MaryGraceCalcutlator/Layout.html"},{"name":"Website","url":"https://sakeun72-cloud.github.io/MaryGraceCalcutlator/"}]')

try{

async function loadFromSupabase(){
  if(!sbClient) return;
  document.getElementById('sb-status').textContent = "⏳ Lade stammdaten...";
  const {data, error} = await sbClient.from('stammdaten').select('*').order('artikelnummer');
  if(error){
    document.getElementById('sb-status').innerHTML = "❌ " + error.message;
    document.getElementById('sb-status').className = "text-[11px] text-red-600 font-bold";
    renderList(); return;
  }
  if(data && data.length>0){
    articles = data.map(d=>{
      const m=d.marketing||{}; const en=m.en||{}, tl=m.tl||{}, de=m.de||{};
      return {
        id: d.artikelnummer, artikelnummer: d.artikelnummer, nameKurz: d.name_kurz||'', nameLang: d.name_lang||'', marke: d.marke||'', sorte: d.sorte||'', qualitaet: d.qualitaet||'Premium', herkunft: d.herkunft||'', erntejahr: d.erntejahr||'', gewicht: d.gewicht||'', einheit: d.einheit||'kg', distributor: 'Kingfields Trade',
        geschmackEn: en.geschmack||'', geschmackTl: tl.geschmack||'', geschmackDe: de.geschmack||'',
        aromaEn: en.aroma||'', aromaTl: tl.aroma||'', aromaDe: de.aroma||'',
        texturEn: en.textur||'', texturTl: tl.textur||'', texturDe: de.textur||'',
        passtZuEn: en.passtZu||'', passtZuTl: tl.passtZu||'', passtZuDe: de.passtZu||'',
        kochmethodeEn: en.kochmethode||'', kochmethodeTl: tl.kochmethode||'', kochmethodeDe: de.kochmethode||'',
        sloganEn: en.slogan||'', sloganTl: tl.slogan||'', sloganDe: de.slogan||'',
        shortEn: en.short||'', shortTl: tl.short||'', shortDe: de.short||'',
        storyEn: en.story||'', storyTl: tl.story||'', storyDe: de.story||'',
        tasteEn: en.taste||'', tasteTl: tl.taste||'', tasteDe: de.taste||'',
        originEn: en.origin||'', originTl: tl.origin||'', originDe: de.origin||'',
        cookingEn: en.cooking||'', cookingTl: tl.cooking||'', cookingDe: de.cooking||'',
        bildSackUrl: d.bild_sack_url||'', bildReisUrl: d.bild_reis_url||'', status: 'Active'
      }
    });
    localStorage.setItem('kingfields_full_v3', JSON.stringify(articles));
    document.getElementById('sb-status').textContent = "✅ " + articles.length + " Artikel aus Supabase geladen";
    document.getElementById('sb-status').className = "text-[11px] text-green-600 font-bold";
  } else {
    document.getElementById('sb-status').textContent = "⚠ Supabase leer - nutze " + articles.length + " aus localStorage";
  }
  renderList();
}

async function migrateLocalToSupabase(){
  if(!sbClient){ showToast('❌ Kein Supabase'); return; }
  const local = JSON.parse(localStorage.getItem('kingfields_full_v3')||'[]');
  if(local.length===0){ showToast('Keine lokalen Artikel'); return; }
  if(!confirm(local.length + ' Artikel nach Supabase?')) return;
  document.getElementById('sb-status').textContent = '⏳ Migriere ' + local.length + ' Artikel...';
  let ok=0, fail=0;
  for(const a of local){
    const payload={
      artikelnummer:a.artikelnummer, name_kurz:a.nameKurz||'', name_lang:a.nameLang||'', marke:a.marke||'', sorte:a.sorte||'', qualitaet:a.qualitaet||'Premium', herkunft:a.herkunft||'Thailand', erntejahr:a.erntejahr||'2024', gewicht:a.gewicht||'5', einheit:a.einheit||'kg',
      marketing:{ en:{geschmack:a.geschmackEn||'', aroma:a.aromaEn||'', textur:a.texturEn||'', passtZu:a.passtZuEn||'', kochmethode:a.kochmethodeEn||'', slogan:a.sloganEn||'', short:a.shortEn||'', story:a.storyEn||'', taste:a.tasteEn||'', origin:a.originEn||'', cooking:a.cookingEn||''}, tl:{geschmack:a.geschmackTl||'', aroma:a.aromaTl||'', textur:a.texturTl||'', passtZu:a.passtZuTl||'', kochmethode:a.kochmethodeTl||'', slogan:a.sloganTl||'', short:a.shortTl||'', story:a.storyTl||'', taste:a.tasteTl||'', origin:a.originTl||'', cooking:a.cookingTl||''}, de:{geschmack:a.geschmackDe||'', aroma:a.aromaDe||'', textur:a.texturDe||'', passtZu:a.passtZuDe||'', kochmethode:a.kochmethodeDe||'', slogan:a.sloganDe||'', short:a.shortDe||'', story:a.storyDe||'', taste:a.tasteDe||'', origin:a.originDe||'', cooking:a.cookingDe||''} },
      bild_sack_url:a.bildSackUrl||'', bild_reis_url:a.bildReisUrl||'', status:'Active'
    };
    const {error}=await sbClient.from('stammdaten').upsert(payload,{onConflict:'artikelnummer'});
    if(error){ fail++; showToast('Fehler '+a.artikelnummer+': '+error.message); } else ok++;
  }
  document.getElementById('sb-status').textContent = '✅ Migration: ' + ok + ' ok, ' + fail + ' fail';
  showToast('✅ ' + ok + ' Artikel nach Supabase'); loadFromSupabase();
}

function testConnection(){ sbClient.from('stammdaten').select('artikelnummer').limit(1).then(({data,error})=>{ if(error) showToast('Fail: '+error.message); else showToast('✅ Connected, '+data.length+' sample') }) }
function openLink(i){ const l=navLinks[i]; if(l&&l.url) window.open(l.url,'_blank'); else { showToast('Kein Link'); toggleNavEdit() } }
function toggleNavEdit(){ const el=document.getElementById('nav-edit'); el.classList.toggle('hidden'); for(let i=0;i<4;i++){ document.getElementById('nav-name-'+i).value=navLinks[i]?.name||''; document.getElementById('nav-url-'+i).value=navLinks[i]?.url||'' } }
function saveNavLinks(){ for(let i=0;i<4;i++){ navLinks[i]={name:document.getElementById('nav-name-'+i).value||('Button '+(i+1)), url:document.getElementById('nav-url-'+i).value||''}; const lbl=document.getElementById('nav-label-'+i); if(lbl) lbl.textContent=navLinks[i].name } localStorage.setItem('navLinks', JSON.stringify(navLinks)); document.getElementById('nav-edit').classList.add('hidden'); showToast('Links gespeichert') }
function loadNavLabels(){ for(let i=0;i<4;i++){ const lbl=document.getElementById('nav-label-'+i); if(lbl&&navLinks[i]) lbl.textContent=navLinks[i].name } }
function t(en,tl,de){ if(lang==='EN') return en; if(lang==='TL') return tl; return de }
function showToast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.remove('hidden'); setTimeout(()=>el.classList.add('hidden'),3500) }
function getNextArtNr(){ let max=0; articles.forEach(a=>{ const n=parseInt((a.artikelnummer||'').replace(/\D/g,''))||0; if(n>max) max=n }); return String(max+1).padStart(3,'0') }
function newArticle(){
  const nr=getNextArtNr()
  current={ id:Date.now().toString(), artikelnummer:nr, nameKurz:'', nameLang:'', marke:'', sorte:'Hasmin', qualitaet:'Premium', herkunft:'Thailand', erntejahr:new Date().getFullYear(), gewicht:'5', einheit:'kg', distributor:'Kingfields Trade', geschmackEn:'', geschmackTl:'', geschmackDe:'', aromaEn:'', aromaTl:'', aromaDe:'', texturEn:'', texturTl:'', texturDe:'', passtZuEn:'', passtZuTl:'', passtZuDe:'', kochmethodeEn:'', kochmethodeTl:'', kochmethodeDe:'', sloganEn:'', sloganTl:'', sloganDe:'', shortEn:'', shortTl:'', shortDe:'', storyEn:'', storyTl:'', storyDe:'', tasteEn:'', tasteTl:'', tasteDe:'', originEn:'', originTl:'', originDe:'', cookingEn:'', cookingTl:'', cookingDe:'', status:'Draft', bildSackUrl:'', bildReisUrl:'', bildSack:'', bildReis:'' }
  bildSackBase64=null; bildReisBase64=null; bildSackFile=null; zoom=1; panX=0; panY=0; renderForm(); showToast('New article '+nr)
}
function renderList(){
  const q=document.getElementById('search').value.toLowerCase()
  const list=document.getElementById('list')
  const filtered = articles.filter(a=>(a.artikelnummer+' '+a.nameKurz+' '+a.marke).toLowerCase().includes(q))
  if(filtered.length===0){ list.innerHTML = '<div class="text-center text-xs text-zinc-400 py-10">Keine Artikel<br><button onclick="newArticle()" class="mt-2 bg-black text-white px-3 py-1 rounded-full">+ Ersten erstellen</button></div>'; return; }
  list.innerHTML=filtered.map(a=>`
    <div onclick="openArticle('${a.id}')" class="border rounded-[12px] p-2 cursor-pointer hover:bg-zinc-50 ${current&&current.id===a.id?'bg-zinc-100 border-zinc-900':''}">
      <div class="flex gap-2">
        <div class="w-12 h-12 rounded-lg bg-zinc-100 overflow-hidden flex-shrink-0 chessboard">${a.bildSackUrl?`<img src="${a.bildSackUrl}" class="w-full h-full object-cover">`: (a.bildSack?`<img src="${a.bildSack}" class="w-full h-full object-cover">`:'')}</div>
        <div class="flex-1 min-w-0">
          <div class="font-bold text-[13px] truncate">${a.artikelnummer||'???'} ${a.status==='Active'?'<span class="bg-green-100 text-green-700 text-[10px] px-1.5 py-0.5 rounded-full">Active</span>':'<span class="bg-zinc-200 text-[10px] px-1.5 py-0.5 rounded-full">Draft</span>'}</div>
          <div class="text-[11px] truncate">${a.nameKurz||a.sorte||''} • ${a.marke||''}</div>
          ${a.bildSackUrl?'<div class="text-[9px] text-green-600">✓ Supabase</div>':''}
        </div>
      </div>
    </div>
  `).join('')
}
function openArticle(id){ current=articles.find(a=>a.id===id); bildSackBase64=current.bildSack||null; bildReisBase64=current.bildReis||null; zoom=current.bildReisZoom||1; panX=current.bildReisPanX||0; panY=current.bildReisPanY||0; isRound=current.bildReisRund||false; renderForm() }
function base64ToBlob(b64){ const arr=b64.split(','), mime=arr[0].match(/:(.*?);/)[1], bstr=atob(arr[1]); let n=bstr.length; const u8=new Uint8Array(n); while(n--) u8[n]=bstr.charCodeAt(n); return new Blob([u8],{type:mime}) }
function getCroppedBlob(){ return new Promise(res=>{ if(!bildReisBase64) return res(null); const c=document.createElement('canvas'); c.width=800; c.height=800; const ctx=c.getContext('2d'); if(isRound){ ctx.beginPath(); ctx.arc(400,400,400,0,Math.PI*2); ctx.clip() } const img=new Image(); img.onload=()=>{ const w=img.width*zoom, h=img.height*zoom, x=(800-w)/2+panX, y=(800-h)/2+panY; ctx.drawImage(img,x,y,w,h); c.toBlob(b=>res(b),'image/png',0.9) }; img.src=bildReisBase64 }) }
async function uploadToSupabase(artNr){
  if(!sbClient) return {sackUrl: current.bildSackUrl||null, reisUrl: current.bildReisUrl||null}
  let sackUrl=current.bildSackUrl||null, reisUrl=current.bildReisUrl||null
  try{
    if(bildSackFile||bildSackBase64){
      let blob=bildSackFile; if(!blob&&bildSackBase64) blob=base64ToBlob(bildSackBase64)
      const path=`${artNr}/sack.png`
      const {error}=await sbClient.storage.from('sack-bilder').upload(path, blob, {upsert:true, contentType:'image/png'}); if(error) throw error
      sackUrl=sbClient.storage.from('sack-bilder').getPublicUrl(path).data.publicUrl
    }
    if(bildReisBase64){
      const cropped=await getCroppedBlob()
      if(cropped){ const path=`${artNr}/reis-detail.png`; const {error}=await sbClient.storage.from('reis-detail-bilder').upload(path,cropped,{upsert:true, contentType:'image/png'}); if(error) throw error; reisUrl=sbClient.storage.from('reis-detail-bilder').getPublicUrl(path).data.publicUrl }
    }
    return {sackUrl, reisUrl}
  }catch(e){ showToast('Upload error: '+e.message); return {sackUrl, reisUrl} }
}
async function saveCurrent(){
  if(!current) return
  const artNr=document.getElementById('f-artnr').value.trim()
  if(!artNr){ showToast('Artikelnummer nötig'); return }
  const fields=['nameKurz','nameLang','marke','sorte','qualitaet','herkunft','erntejahr','gewicht','einheit','distributor','geschmack','aroma','textur','passtZu','kochmethode','slogan','short','story','taste','origin','cooking']
  fields.forEach(f=>{
    const el=document.getElementById('f-'+f)
    if(el){
      if(lang==='EN') current[f+'En']=el.value
      else if(lang==='TL') current[f+'Tl']=el.value
      else current[f+'De']=el.value
      if(['nameKurz','marke','sorte','gewicht'].includes(f)) current[f]=el.value
    }
  })
  current.artikelnummer=artNr; current.nameKurz=document.getElementById('f-nameKurz').value; current.nameLang=document.getElementById('f-nameLang').value; current.marke=document.getElementById('f-marke').value; current.sorte=document.getElementById('f-sorte').value; current.qualitaet=document.getElementById('f-qualitaet').value; current.herkunft=document.getElementById('f-herkunft').value; current.erntejahr=document.getElementById('f-erntejahr').value; current.gewicht=document.getElementById('f-gewicht').value; current.einheit=document.getElementById('f-einheit').value; current.status=artNr?'Active':'Draft'
  current.bildSack=bildSackBase64; current.bildReis=bildReisBase64; current.bildReisZoom=zoom; current.bildReisPanX=panX; current.bildReisPanY=panY; current.bildReisRund=isRound
  if(sbClient){
    const urls=await uploadToSupabase(artNr); if(urls.sackUrl) current.bildSackUrl=urls.sackUrl; if(urls.reisUrl) current.bildReisUrl=urls.reisUrl
    const payload={ artikelnummer:artNr, name_kurz:current.nameKurz, name_lang:current.nameLang, marke:current.marke, sorte:current.sorte, qualitaet:current.qualitaet, herkunft:current.herkunft, erntejahr:current.erntejahr, gewicht:current.gewicht, einheit:current.einheit, marketing:{ en:{geschmack:current.geschmackEn, aroma:current.aromaEn, textur:current.texturEn, passtZu:current.passtZuEn, kochmethode:current.kochmethodeEn, slogan:current.sloganEn, short:current.shortEn, story:current.storyEn, taste:current.tasteEn, origin:current.originEn, cooking:current.cookingEn}, tl:{geschmack:current.geschmackTl, aroma:current.aromaTl, textur:current.texturTl, passtZu:current.passtZuTl, kochmethode:current.kochmethodeTl, slogan:current.sloganTl, short:current.shortTl, story:current.storyTl, taste:current.tasteTl, origin:current.originTl, cooking:current.cookingTl}, de:{geschmack:current.geschmackDe, aroma:current.aromaDe, textur:current.texturDe, passtZu:current.passtZuDe, kochmethode:current.kochmethodeDe, slogan:current.sloganDe, short:current.shortDe, story:current.storyDe, taste:current.tasteDe, origin:current.originDe, cooking:current.cookingDe} }, bild_sack_url:current.bildSackUrl, bild_reis_url:current.bildReisUrl, status:'Active' }
    const {error}=await sbClient.from('stammdaten').upsert(payload,{onConflict:'artikelnummer'})
    if(error) showToast('DB error: '+error.message); else showToast('✅ Gespeichert: '+artNr)
  }
  const idx=articles.findIndex(a=>a.id===current.id); if(idx>=0) articles[idx]=current; else articles.push(current)
  localStorage.setItem('kingfields_full_v3', JSON.stringify(articles)); renderList()
}
function renderForm(){
  if(!current){ document.getElementById('form').innerHTML=`<div class="text-center py-20 text-zinc-400"><div class="font-display text-xl mb-2">${t('Select article','Pumili ng article','Artikel wählen')}</div><button onclick="newArticle()" class="bg-black text-white px-6 py-2 rounded-full text-sm">+ New ${getNextArtNr()}</button></div>`; return }
  const val = (fieldBase) => { if(lang==='EN') return current[fieldBase+'En']||''; if(lang==='TL') return current[fieldBase+'Tl']||''; return current[fieldBase+'De']||'' }
  document.getElementById('form').innerHTML=`
    <div class="space-y-6">
      <div><h3 class="font-display font-semibold text-[16px] mb-3">${t('Technical Data','Teknikal na Data','Technische Daten')} • ${current.status} • ${lang}</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div><label class="text-[11px] font-medium text-zinc-500">Article Nr * 001</label><input id="f-artnr" value="${current.artikelnummer||''}" class="w-full border rounded-full px-3 py-2 text-sm"></div>
          <div><label class="text-[11px] text-zinc-500">Brand</label><input id="f-marke" value="${current.marke||''}" class="w-full border rounded-full px-3 py-2 text-sm"></div>
          <div><label class="text-[11px] text-zinc-500">Kurz Name</label><input id="f-nameKurz" value="${current.nameKurz||''}" class="w-full border rounded-full px-3 py-2 text-sm"></div>
          <div><label class="text-[11px] text-zinc-500">Lang Name</label><input id="f-nameLang" value="${current.nameLang||''}" class="w-full border rounded-full px-3 py-2 text-sm"></div>
          <div><label class="text-[11px] text-zinc-500">Sorte</label><input id="f-sorte" value="${current.sorte||''}" class="w-full border rounded-full px-3 py-2 text-sm"></div>
          <div><label class="text-[11px] text-zinc-500">Qualität</label><select id="f-qualitaet" class="w-full border rounded-full px-3 py-2 text-sm"><option>Premium</option><option>Standard</option><option>Organic</option></select></div>
          <div><label class="text-[11px] text-zinc-500">Herkunft</label><input id="f-herkunft" value="${current.herkunft||''}" class="w-full border rounded-full px-3 py-2 text-sm"></div>
          <div><label class="text-[11px] text-zinc-500">Erntejahr</label><input id="f-erntejahr" value="${current.erntejahr||''}" class="w-full border rounded-full px-3 py-2 text-sm"></div>
          <div><label class="text-[11px] text-zinc-500">Gewicht</label><input id="f-gewicht" value="${current.gewicht||''}" class="w-full border rounded-full px-3 py-2 text-sm"></div>
          <div><label class="text-[11px] text-zinc-500">Einheit</label><input id="f-einheit" value="${current.einheit||'kg'}" class="w-full border rounded-full px-3 py-2 text-sm"></div>
          <div class="col-span-2"><label class="text-[11px] text-zinc-500">Distributor</label><input id="f-distributor" value="${current.distributor||'Kingfields Trade'}" class="w-full border rounded-full px-3 py-2 text-sm"></div>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div><label class="text-xs font-bold">1. Sack Bild (transparent)</label><div id="drop-sack" class="chessboard border-2 border-dashed rounded-[16px] h-[320px] flex items-center justify-center relative overflow-hidden cursor-pointer mt-1" onclick="document.getElementById('file-sack').click()">${bildSackBase64?`<img src="${bildSackBase64}" class="max-w-full max-h-full object-contain">`:`<div class="bg-white px-3 py-1 rounded-full text-xs shadow">Click / Drop sack image</div>`}</div><input id="file-sack" type="file" accept="image/*" class="hidden" onchange="handleSackFile(this)"></div>
        <div><label class="text-xs font-bold">2. Loser Reis Detail (Zuschneiden)</label><div id="drop-reis" class="border-2 border-dashed rounded-[16px] h-[320px] flex items-center justify-center relative overflow-hidden bg-zinc-100 cursor-pointer mt-1" onclick="document.getElementById('file-reis').click()">${bildReisBase64?`<img id="reis-img" src="${bildReisBase64}" style="transform: translate(${panX}px, ${panY}px) scale(${zoom}); ${isRound?'border-radius:50%':''}" class="max-w-full max-h-full object-contain">`:`<div class="bg-white px-3 py-1 rounded-full text-xs shadow">Click Reis Bild</div>`}</div><input id="file-reis" type="file" accept="image/*" class="hidden" onchange="handleReisFile(this)"></div>
      </div>
      <div class="bg-amber-50 border border-amber-200 rounded-[16px] p-4"><h3 class="font-display font-semibold text-[14px] mb-3">🍚 Food Properties • ${lang}</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><div><label class="text-[11px] font-medium">Geschmack</label><input id="f-geschmack" value="${val('geschmack')}" class="w-full border rounded-full px-3 py-2 text-sm bg-white"></div><div><label class="text-[11px] font-medium">Aroma</label><input id="f-aroma" value="${val('aroma')}" class="w-full border rounded-full px-3 py-2 text-sm bg-white"></div><div><label class="text-[11px] font-medium">Textur</label><input id="f-textur" value="${val('textur')}" class="w-full border rounded-full px-3 py-2 text-sm bg-white"></div><div><label class="text-[11px] font-medium">Kochmethode</label><input id="f-kochmethode" value="${val('kochmethode')}" class="w-full border rounded-full px-3 py-2 text-sm bg-white"></div><div class="md:col-span-2"><label class="text-[11px] font-medium">Passt gut zu</label><input id="f-passtZu" value="${val('passtZu')}" class="w-full border rounded-full px-3 py-2 text-sm bg-white"></div></div></div>
      <div class="flex gap-2"><button onclick="saveCurrent()" class="flex-1 bg-black text-white py-3 rounded-full font-bold text-sm">💾 In Supabase speichern ✅</button><button onclick="deleteCurrent()" class="bg-red-50 text-red-600 border border-red-200 px-6 py-3 rounded-full text-sm">Delete</button></div>
    </div>
  `
  document.getElementById('f-qualitaet').value=current.qualitaet||'Premium'
}
function handleSackFile(input){ const file=input.files[0]; if(!file) return; bildSackFile=file; const r=new FileReader(); r.onload=e=>{ bildSackBase64=e.target.result; renderForm() }; r.readAsDataURL(file) }
function handleReisFile(input){ const file=input.files[0]; if(!file) return; const r=new FileReader(); r.onload=e=>{ bildReisBase64=e.target.result; renderForm() }; r.readAsDataURL(file) }
function deleteCurrent(){ if(!confirm('Delete '+current.artikelnummer+'?')) return; articles=articles.filter(a=>a.id!==current.id); localStorage.setItem('kingfields_full_v3', JSON.stringify(articles)); current=null; renderList(); renderForm(); }
function setLang(l){ if(current){ const fields=['geschmack','aroma','textur','passtZu','kochmethode','slogan','short','story','taste','origin','cooking']; fields.forEach(f=>{ const el=document.getElementById('f-'+f); if(el){ if(lang==='EN') current[f+'En']=el.value; else if(lang==='TL') current[f+'Tl']=el.value; else current[f+'De']=el.value; } }) } lang=l; localStorage.setItem('lang',l); document.querySelectorAll('[id^=btn-]').forEach(b=>{ b.className='px-4 py-1.5 rounded-full text-sm text-zinc-600' }); document.getElementById('btn-'+l.toLowerCase()).className='px-4 py-1.5 rounded-full text-sm bg-black text-white font-medium'; if(current) renderForm() }
setLang(lang); renderList(); loadNavLabels();
</script>
</body>
</html>
