<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Facebook Product Studio - V10 FINAL - Leere Felder versteckt</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>.font-display{font-family:"Fraunces",serif}.font-body{font-family:"Plus Jakarta Sans",sans-serif}.chess{background-image:linear-gradient(45deg,#e5e7eb 25%,transparent 25%),linear-gradient(-45deg,#e5e7eb 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5e7eb 75%),linear-gradient(-45deg,transparent 75%,#e5e7eb 75%);background-size:20px 20px;}</style>
</head>
<body class="bg-[#f6f5f2] font-body min-h-screen p-4">
<div class="max-w-[1600px] mx-auto">

<div class="bg-white rounded-[20px] p-4 mb-4 border shadow-sm">
  <div class="flex flex-wrap justify-between items-center gap-3">
    <div>
      <h1 class="font-display text-xl font-bold">Facebook Product Studio - V10 FINAL</h1>
      <p class="text-[11px] text-green-600 font-bold">✅ FIX: Leere Felder werden komplett versteckt! • Supabase unten!</p>
    </div>
    <div class="flex gap-2 items-center">
      <select id="article-select" onchange="selectArticle(this.value)" class="border rounded-full px-4 py-2 text-sm min-w-[200px]"><option>-- Artikel wählen --</option></select>
      <div class="flex bg-zinc-100 rounded-full p-1">
        <button onclick="setLang('EN')" id="btn-en" class="px-3 py-1 rounded-full text-xs bg-black text-white">EN</button>
        <button onclick="setLang('TL')" id="btn-tl" class="px-3 py-1 rounded-full text-xs">TL</button>
        <button onclick="setLang('DE')" id="btn-de" class="px-3 py-1 rounded-full text-xs">DE</button>
      </div>
      <button onclick="loadFromSupabase()" class="bg-black text-white px-4 py-2 rounded-full text-xs">🔄 Aus Supabase laden</button>
    </div>
  </div>
</div>

<div class="grid grid-cols-12 gap-4">
  <div class="col-span-12">
    <div class="bg-white rounded-[20px] p-3 border">
      <div class="text-xs font-bold mb-2">Layout 1 - Classic (1080x1080) - DE • Mit FIX</div>
      <div id="preview1" class="overflow-auto border rounded-xl"></div>
    </div>
  </div>
</div>

<div class="mt-8 bg-zinc-50 border border-zinc-200 rounded-[12px] p-2 opacity-40 hover:opacity-100 transition-opacity">
  <div class="flex flex-wrap gap-2 items-center text-[10px] text-zinc-500">
    <span class="font-bold">🔧 Supabase Config (ganz unten, ausgegraut):</span>
    <input id="sb-url" value="https://crdtuptjybxbsezxtksp.supabase.co" class="border rounded-full px-2 py-1 text-[10px] min-w-[180px] bg-white">
    <input id="sb-key" type="password" value="sb_publishable_GU6AAlF0zc3LB4hFlKK0fw_TNxo9z7q" class="border rounded-full px-2 py-1 text-[10px] min-w-[180px] bg-white">
    <button onclick="saveSB()" class="bg-zinc-700 text-white px-3 py-1 rounded-full text-[10px]">Connect</button>
    <span id="sb-status" class="text-[10px]">✅ Verbunden!</span>
  </div>
</div>

<div id="toast" class="fixed bottom-4 right-4 bg-zinc-900 text-white px-4 py-2 rounded-full text-sm hidden"></div>
</div>

<script>
const SUPABASE_URL = "https://crdtuptjybxbsezxtksp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_GU6AAlF0zc3LB4hFlKK0fw_TNxo9z7q";
let lang = localStorage.getItem('lang')||'DE';
let articles = [];
let current = null;
let sbClient = null;

try{
  sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  setTimeout(()=>loadFromSupabase(),500);
}catch(e){console.error(e)}

async function loadFromSupabase(){
  if(!sbClient) return;
  document.getElementById('sb-status').textContent = "⏳ Lade...";
  const {data, error} = await sbClient.from('stammdaten').select('*').order('artikelnummer');
  if(error){ document.getElementById('sb-status').textContent = "❌ "+error.message; return; }
  articles = data.map(d=>{
    const m=d.marketing||{}; const en=m.en||{}, tl=m.tl||{}, de=m.de||{};
    return {
      id: d.artikelnummer, artikelnummer: d.artikelnummer,
      nameKurz: d.name_kurz||'', nameLang: d.name_lang||'',
      marke: d.marke||'Fuji', sorte: d.sorte||'',
      qualitaet: d.qualitaet||'Premium', herkunft: d.herkunft||'Thailand',
      erntejahr: d.erntejahr||'2024', gewicht: d.gewicht||'5', einheit: d.einheit||'kg',
      geschmackEn: en.geschmack||'', geschmackTl: tl.geschmack||'', geschmackDe: de.geschmack||'',
      aromaEn: en.aroma||'', aromaTl: tl.aroma||'', aromaDe: de.aroma||'',
      texturEn: en.textur||'', texturTl: tl.textur||'', texturDe: de.textur||'',
      passtZuEn: en.passtZu||'', passtZuTl: tl.passtZu||'', passtZuDe: de.passtZu||'',
      kochmethodeEn: en.kochmethode||'', kochmethodeTl: tl.kochmethode||'', kochmethodeDe: de.kochmethode||'',
      sloganEn: en.slogan||'', sloganTl: tl.slogan||'', sloganDe: de.slogan||'',
      shortEn: en.short||'', shortTl: tl.short||'', shortDe: de.short||'',
      storyEn: en.story||'', storyTl: tl.story||'', storyDe: de.story||'',
      bildSackUrl: d.bild_sack_url||'', bildReisUrl: d.bild_reis_url||''
    };
  });
  const sel=document.getElementById('article-select');
  sel.innerHTML='<option value="">-- Artikel wählen (DR Menü) --</option>'+articles.map(a=>`<option value="${a.id}">${a.artikelnummer} - ${a.nameKurz||a.sorte}</option>`).join('');
  document.getElementById('sb-status').textContent = "✅ Verbunden! "+articles.length+" Artikel gefunden";
  if(articles.length>0){ selectArticle(articles[0].id); sel.value=articles[0].id; }
}

function selectArticle(id){ current=articles.find(a=>a.id===id); if(current) renderLayouts(); }

function val(field){
  if(!current) return '';
  // Check current language first, then fallback to any language that has value?
  // FIX: Only return current lang, don't fallback if user wants empty to hide!
  if(lang==='EN') return (current[field+'En']||'').trim();
  if(lang==='TL') return (current[field+'Tl']||'').trim();
  return (current[field+'De']||'').trim();
}

function hasVal(field){
  const v = val(field);
  if(!v) return false;
  const s = String(v).trim();
  return s!=='' && s.toLowerCase()!=='null' && s.toLowerCase()!=='undefined' && s!=='-' && s.length>0;
}

function getVal(field){ return val(field)||''; }

function setLang(l){
  lang=l; localStorage.setItem('lang',l);
  document.querySelectorAll('[id^=btn-]').forEach(b=>b.className='px-3 py-1 rounded-full text-xs');
  document.getElementById('btn-'+l.toLowerCase()).className='px-3 py-1 rounded-full text-xs bg-black text-white';
  if(current) renderLayouts();
}

function renderLayouts(){
  if(!current) return;

  // DEBUG: log what hasVal returns
  console.log("LANG:", lang, "textur:", val('textur'), "hasVal:", hasVal('textur'), "geschmack:", val('geschmack'), "hasVal geschmack:", hasVal('geschmack'));

  const textureBlock = hasVal('textur') ? `
    <div style="background:#f4f4f5;border-radius:16px;padding:14px 18px;">
      <div style="font-size:11px;letter-spacing:2px;color:#a1a1aa;font-family:'Plus Jakarta Sans';font-weight:600;">TEXTURE</div>
      <div style="font-size:15px;font-weight:600;margin-top:4px;color:#18181b;">${getVal('textur')}</div>
    </div>
  ` : '';

  const pairsBlock = hasVal('passtZu') ? `
    <div style="background:#fefce8;border:1px solid #fef08a;border-radius:16px;padding:14px 18px;">
      <div style="font-size:11px;letter-spacing:2px;color:#a16207;font-family:'Plus Jakarta Sans';font-weight:600;">PAIRS WELL WITH / PASST ZU</div>
      <div style="font-size:15px;font-weight:600;margin-top:4px;color:#713f12;">${getVal('passtZu')}</div>
    </div>
  ` : '';

  const cookingBlock = hasVal('kochmethode') ? `
    <div style="background:#18181b;color:white;border-radius:16px;padding:14px 18px;">
      <div style="font-size:11px;letter-spacing:2px;color:#a1a1aa;font-family:'Plus Jakarta Sans';font-weight:600;">COOKING</div>
      <div style="font-size:14px;margin-top:4px;">${getVal('kochmethode')}</div>
    </div>
  ` : '';

  const tasteAromaBlock = (hasVal('geschmack') || hasVal('aroma')) ? `
    <div style="display:flex;gap:16px;align-items:flex-start;">
      ${hasVal('bildReisUrl')? `<img src="${current.bildReisUrl}" style="width:88px;height:88px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #e4e4e7;">`:''}
      <div>
        <div style="font-size:11px;letter-spacing:2px;color:#a1a1aa;font-family:'Plus Jakarta Sans';font-weight:600;">TASTE & AROMA</div>
        ${hasVal('geschmack')? `<div style="font-size:18px;font-weight:700;margin-top:6px;line-height:1.2;color:#18181b;">${getVal('geschmack')}</div>`:''}
        ${hasVal('aroma')? `<div style="font-size:14px;color:#71717a;margin-top:4px;">${getVal('aroma')}</div>`:''}
      </div>
    </div>
  ` : '';

  const layout1 = `
    <div style="width:1080px;height:1080px;background:#fcfbf8;display:flex;flex-direction:row;padding:32px;box-sizing:border-box;font-family:'Fraunces',serif;position:relative;">
      <div style="width:50%;display:flex;flex-direction:column;justify-content:space-between;">
        <div>
          <div style="font-size:13px;letter-spacing:2px;color:#a1a1aa;text-transform:uppercase;">• ${current.marke||'Fuji'} • ${current.qualitaet||'Premium'}</div>
          <div style="font-size:44px;font-weight:700;line-height:1.05;margin-top:12px;color:#18181b;">${getVal('nameKurz')||getVal('slogan')||'Thai Duftreis - Premium Qualität'}</div>
          <div style="font-size:18px;color:#71717a;margin-top:12px;">${getVal('short')||''}</div>
          <div style="margin-top:8px;font-size:11px;color:#a1a1aa;">DEBUG: textur='${getVal('textur')}' hasVal=${hasVal('textur')} | geschmack hasVal=${hasVal('geschmack')}</div>
        </div>
        <div style="width:100%;height:560px;background:white;border-radius:24px;display:flex;align-items:center;justify-content:center;overflow:hidden;">
          ${current.bildSackUrl? `<img src="${current.bildSackUrl}" style="width:95%;height:95%;object-fit:contain;">` : `<div style="color:#aaa;">Kein Sack Bild</div>`}
        </div>
        <div style="font-size:13px;color:#a1a1aa;">${current.artikelnummer} • ${current.gewicht}${current.einheit} • ${current.herkunft} ${current.erntejahr}</div>
      </div>
      <div style="width:50%;padding-left:32px;display:flex;flex-direction:column;gap:16px;">
        ${tasteAromaBlock}
        ${textureBlock}
        ${pairsBlock}
        ${cookingBlock}
        <div style="flex:1"></div>
        <div style="font-size:12px;color:#a1a1aa;text-align:right;">Kingfields Trade • Thailand</div>
      </div>
    </div>
  `;

  document.getElementById('preview1').innerHTML = layout1;
}

function saveSB(){}
setLang(lang);
</script>
</body>
</html>
