function base64ToBlob(b64){ 
  try{
    if(!b64) return null;
    if(b64.startsWith('http')) return null; // Already URL, no blob needed
    if(!b64.startsWith('data:')) return null;
    const arr=b64.split(','), mimeMatch=arr[0].match(/:(.*?);/);
    if(!mimeMatch) return null;
    const mime=mimeMatch[1], bstr=atob(arr[1]); 
    let n=bstr.length; const u8=new Uint8Array(n); while(n--) u8[n]=bstr.charCodeAt(n); 
    return new Blob([u8],{type:mime});
  }catch(e){ console.error('base64ToBlob error', e, b64.substring(0,100)); return null; }
}
function getCroppedBlob(){ return new Promise(res=>{ if(!bildReisBase64) return res(null); const c=document.createElement('canvas'); c.width=800; c.height=800; const ctx=c.getContext('2d'); if(isRound){ ctx.beginPath(); ctx.arc(400,400,400,0,Math.PI*2); ctx.clip() } const img=new Image(); img.onload=()=>{ const w=img.width*zoom, h=img.height*zoom, x=(800-w)/2+panX, y=(800-h)/2+panY; ctx.drawImage(img,x,y,w,h); c.toBlob(b=>res(b),'image/png',0.9) }; img.src=bildReisBase64 }) }
async function uploadToSupabase(artNr){

    // Sack Bild - nur wenn neues File oder data URL

      const path=`${artNr}/sack.png`
      console.log('Uploading sack file', bildSackFile.name, bildSackFile.size);

      sackUrl=sbClient.storage.from('sack-bilder').getPublicUrl(path).data.publicUrl
      console.log('Sack URL:', sackUrl);
    } else if(bildSackBase64 && bildSackBase64.startsWith('data:')){
      const blob=base64ToBlob(bildSackBase64)
      if(blob){
        const path=`${artNr}/sack.png`
        const {error}=await sbClient.storage.from('sack-bilder').upload(path, blob, {upsert:true, contentType:'image/png'}); 
        if(error) throw error
        sackUrl=sbClient.storage.from('sack-bilder').getPublicUrl(path).data.publicUrl
      }
    }
    // Sack VIDEO
    if(typeof bildSackVideoFile!=='undefined' && bildSackVideoFile){
      const path=`${artNr}/sack-video.mp4`
      console.log('Uploading sack video', bildSackVideoFile.name);
      const {error}=await sbClient.storage.from('sack-bilder').upload(path, bildSackVideoFile, {upsert:true, contentType:'video/mp4'}); 
      if(error) throw error
      sackVideoUrl=sbClient.storage.from('sack-bilder').getPublicUrl(path).data.publicUrl
      console.log('Sack Video URL:', sackVideoUrl);
    }
    // Reis Bild - nur wenn data URL (cropped)
    if(bildReisBase64 && bildReisBase64.startsWith('data:') && !bildReisVideoFile){
      const cropped=await getCroppedBlob()
      if(cropped){ 
        const path=`${artNr}/reis-detail.png`; 
        const {error}=await sbClient.storage.from('reis-detail-bilder').upload(path,cropped,{upsert:true, contentType:'image/png'}); 
        if(error) throw error; 
        reisUrl=sbClient.storage.from('reis-detail-bilder').getPublicUrl(path).data.publicUrl 
        console.log('Reis URL:', reisUrl);
      }
    }
    // Reis VIDEO
    if(typeof bildReisVideoFile!=='undefined' && bildReisVideoFile){
      const path=`${artNr}/reis-video.mp4`
      const {error}=await sbClient.storage.from('reis-detail-bilder').upload(path, bildReisVideoFile, {upsert:true, contentType:'video/mp4'}); 
      if(error) throw error
      reisVideoUrl=sbClient.storage.from('reis-detail-bilder').getPublicUrl(path).data.publicUrl
    }
    return {sackUrl, reisUrl, sackVideoUrl, reisVideoUrl}
  }catch(e){ 
    console.error('Upload error', e); 
    showToast('Upload error: '+e.message); 
    return {sackUrl, reisUrl, sackVideoUrl, reisVideoUrl} 
  }
}

function handleSackFile(input){ 
  const file=input.files[0]; if(!file) return; 
  if(!current){ alert('Erst Artikel wählen oder + NEU!'); return; }
  if(file.type.startsWith('video/')){
    bildSackVideoFile=file;
    if(bildSackVideoUrl && bildSackVideoUrl.startsWith('blob:')) URL.revokeObjectURL(bildSackVideoUrl);
    bildSackVideoUrl=URL.createObjectURL(file);
    bildSackBase64=null; bildSackFile=null;
    current.bildSackVideoUrl=bildSackVideoUrl; current.bildSackVideo=bildSackVideoUrl;
    showToast('✓ Sack VIDEO geladen: '+file.name);
  } else {
    bildSackFile=file; 
    const r=new FileReader(); 
    r.onload=e=>{ 
      bildSackBase64=e.target.result; 
      bildSackVideoUrl=null; bildSackVideoFile=null;
      if(current){ current.bildSackVideoUrl=null; }
      renderForm();
      showToast('✓ Sack BILD geladen');
    }; 
    r.readAsDataURL(file);
    return;
  }
  renderForm();
}
function handleSackDrop(e){ e.preventDefault(); const file=e.dataTransfer.files[0]; if(!file) return; handleSackFile({files:[file]}); }
function clearSackMedia(){ bildSackBase64=null; bildSackFile=null; if(bildSackVideoUrl && bildSackVideoUrl.startsWith('blob:')) URL.revokeObjectURL(bildSackVideoUrl); bildSackVideoUrl=null; bildSackVideoFile=null; if(current){ current.bildSackVideoUrl=null; current.bildSackVideo=null; current.bildSack=null; current.bildSackUrl=''; } renderForm(); }

function cleanDemo(){
  const toDelete = articles.filter(a=> (a.artikelnummer||'').toUpperCase().includes('DEMO') || (a.nameKurz||'').toUpperCase().includes('DEMO') || a.artikelnummer==='000' || a.artikelnummer==='999' );
  if(toDelete.length===0){ showToast('Kein Demo'); return; }
  if(!confirm(toDelete.length+' Demo löschen: '+toDelete.map(a=>a.artikelnummer).join(', ')+' ?')) return;
  articles = articles.filter(a=> !toDelete.includes(a));
  localStorage.setItem('kingfields_full_v3', JSON.stringify(articles));
  renderList(); showToast('✅ '+toDelete.length+' Demo gelöscht');
  if(sbClient){ toDelete.forEach(async a=>{ await sbClient.from('stammdaten').delete().eq('artikelnummer', a.artikelnummer); }); }
}
function deleteCurrent(){ if(!confirm('Delete '+current.artikelnummer+'?')) return; articles=articles.filter(a=>a.id!==current.id); localStorage.setItem('kingfields_full_v3', JSON.stringify(articles)); current=null; renderList(); renderForm(); }
