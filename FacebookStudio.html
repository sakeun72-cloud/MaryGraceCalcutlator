<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produkt-Layout</title>
  <style>
    /* Tailwind CSS Basis-Styles & Reset */
    *,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb}
    html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    body{margin:0;line-height:inherit;background-color:#f9f6f0;color:#1a1a1a}
    h1,h2,h3,p{margin:0}
    .flex{display:flex}.grid{display:grid}.flex-col{flex-direction:column}
    .items-center{align-items:center}.justify-between{justify-content:space-between}
    .w-full{width:100%}.max-w-[1600px]{max-width:1600px}.mx-auto{margin-left:auto;margin-right:auto}
    .p-4{padding:1rem}.p-6{padding:1.5rem}.md\:p-10{padding:2.5rem}
    .gap-4{gap:1rem}.gap-6{gap:1.5rem}.space-y-4>:not([hidden])~:not([hidden]){margin-top:1rem}
    .rounded-[18px]{border-radius:18px}.rounded-[20px]{border-radius:20px}
    .bg-white{background-color:#fff}.bg-[#f5f0e8]{background-color:#f5f0e8}
    .border{border-width:1px}.border-black\/10{border-color:rgba(0,0,0,.1)}
    .font-bold{font-weight:700}.font-extrabold{font-weight:800}.font-semibold{font-weight:600}
    .text-[28px]{font-size:28px}.text-[32px]{font-size:32px}.text-[16px]{font-size:16px}
    .shadow-sm{box-shadow:0 4px 12px rgba(0,0,0,.08)}
    @media (min-width:768px) {
      .md\:text-[36px]{font-size:36px}
      .md\:text-[44px]{font-size:44px}
      .md\:flex-row{flex-direction:row}
    }
  </style>
</head>
<body class="p-4 md:p-10">
  <div class="max-w-[1600px] mx-auto bg-white rounded-[20px] shadow-sm border border-black/10 p-6 md:p-10">
    
    <div class="flex flex-col lg:flex-row gap-6 justify-between items-start">
      
      <!-- Linke Spalte: Titel & Kilosackpreis -->
      <div class="flex-1 space-y-4">
        <!-- Titel deutlich größer -->
        <h1 class="text-[28px] md:text-[36px] font-bold tracking-tight text-black">
          Beispiel Produktname Premium Qualität
        </h1>
        
        <!-- Artikelnummer MG001 wurde entfernt -->
      </div>

      <!-- Rechte Spalte: Kilosackpreis (deutlich größer & Grundpreis entfernt) -->
      <div class="bg-[#f5f0e8] p-6 rounded-[18px] border border-black/10 flex flex-col items-center justify-center text-center">
        <span class="text-[14px] font-semibold text-black/60 uppercase tracking-widest mb-1">Kilosackpreis</span>
        <!-- Deutlich größer positionierter Preis -->
        <div class="text-[32px] md:text-[44px] font-extrabold text-black leading-none">
          24,99 €
        </div>
        <!-- Grundpreis per Kilo wurde komplett entfernt -->
      </div>

    </div>

    <!-- Zweiter Kasten: Bullet Points breiter und fetter -->
    <div class="mt-8 bg-[#f5f0e8] p-6 md:p-8 rounded-[18px] border border-black/10">
      <h3 class="text-[18px] font-bold mb-4 text-black">Produkteigenschaften</h3>
      <ul class="space-y-3 text-[16px] font-bold text-black/90">
        <li class="flex items-center gap-3">
          <span class="w-2 h-2 rounded-full bg-black shrink-0"></span>
          <span>100% Natürliche Inhaltsstoffe ohne künstliche Zusätze</span>
        </li>
        <li class="flex items-center gap-3">
          <span class="w-2 h-2 rounded-full bg-black shrink-0"></span>
          <span>Besonders ergiebig und optimal in der Anwendung</span>
        </li>
        <li class="flex items-center gap-3">
          <span class="w-2 h-2 rounded-full bg-black shrink-0"></span>
          <span>Streng kontrollierte Premium-Qualität aus nachhaltiger Erzeugung</span>
        </li>
      </ul>
    </div>

  </div>
</body>
</html>
