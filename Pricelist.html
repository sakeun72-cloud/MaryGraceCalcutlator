<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Presyo ng Bigas - Preistafel</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .board {
            background-color: #1a1a1a;
            border: 4px solid #8B4513;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #f1c40f;
            letter-spacing: 2px;
            border-bottom: 2px dashed #f1c40f;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #333;
            padding: 12px;
            text-align: center;
        }
        th {
            color: #f1c40f;
        }
        td.sorte {
            font-weight: bold;
            text-align: left;
            color: #fff;
        }
        .cell-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        input[type="number"] {
            width: 75px;
            padding: 6px;
            background-color: #2c2c2c;
            color: #fff;
            border: 1px solid #555;
            text-align: center;
            border-radius: 4px;
            font-size: 1em;
        }
        /* Pfeile bei Zahlenfeldern ausblenden für sauberes Design */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        .per-kg {
            font-size: 0.8em;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="board">
    <h1>PRESYO NG BIGAS</h1>
    <table>
        <thead>
            <tr>
                <th>Sorte</th>
                <th>1kg</th>
                <th>5kg</th>
                <th>10kg</th>
                <th>25kg</th>
            </tr>
        </thead>
        <tbody id="price-table">
            <!-- Wird per Script gefüllt -->
        </tbody>
    </table>
</div>

<script>
    const varieties = [
        { name: "Fuji", prices: [57, 280, 550, 1350] },
        { name: "Perfect", prices: [54, 265, 520, 1280] },
        { name: "Master Aroma", prices: [55, 270, 530, 1300] },
        { name: "Sinandomeng", prices: [50, 240, 470, 1150] },
        { name: "Jasmine", prices: [52, 250, 490, 1200] },
        { name: "Dinorado", prices: [60, 290, 570, 1400] }
    ];

    const weights = [1, 5, 10, 25];
    const tbody = document.getElementById('price-table');

    varieties.forEach((variety, rowIndex) => {
        const tr = document.createElement('tr');
        
        const tdSorte = document.createElement('td');
        tdSorte.className = 'sorte';
        tdSorte.textContent = variety.name;
        tr.appendChild(tdSorte);

        weights.forEach((weight, colIndex) => {
            const td = document.createElement('td');
            const div = document.createElement('div');
            div.className = 'cell-content';

            const input = document.createElement('input');
            input.type = 'number';
            input.value = variety.prices[colIndex];

            const span = document.createElement('span');
            span.className = 'per-kg';

            function updatePerKg() {
                const total = parseFloat(input.value) || 0;
                const perKg = total / weight;
                span.textContent = `(${perKg.toFixed(2)} / kg)`;
            }

            input.addEventListener('input', updatePerKg);
            updatePerKg(); // Initiale Berechnung beim Laden

            div.appendChild(input);
            div.appendChild(span);
            td.appendChild(div);
            tr.appendChild(td);
        });

        tbody.appendChild(tr);
    });
</script>

</body>
</html>
