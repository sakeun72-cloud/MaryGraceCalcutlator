<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Preistafel Bigas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background-color: #2b2b2b; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: 'Courier New', Courier, monospace; }
        .chalkboard {
            background-color: #1a221e; color: #f2f2f2; border: 15px solid #5c3a21;
            padding: 20px; width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { text-transform: uppercase; border-bottom: 2px dashed #fff; padding-bottom: 10px; margin-top: 0; font-size: 24px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { font-size: 14px; padding: 10px 5px; color: #ffcc00; }
        td { padding: 8px 5px; border-bottom: 1px solid #333; }
        input { background: #333; color: #fff; border: 1px solid #555; width: 65px; text-align: center; padding: 6px; font-family: inherit; font-size: 14px; }
        .name-col { text-align: left; font-weight: bold; width: 120px; }
        .btn-download { margin-top: 25px; padding: 15px 30px; background-color: #5c3a21; color: white; border: none; cursor: pointer; font-size: 18px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="chalkboard" id="capture">
    <h2>Presyo ng Bigas</h2>
    <table>
        <thead>
            <tr><th>Sorte</th><th>1kg</th><th>5kg</th><th>10kg</th><th>25kg</th></tr>
        </thead>
        <tbody>
            <tr><td class="name-col">Fuji</td><td><input type="number" value="57"></td><td><input type="number" value="280"></td><td><input type="number" value="550"></td><td><input type="number" value="1350"></td></tr>
            <tr><td class="name-col">Perfect</td><td><input type="number" value="54"></td><td><input type="number" value="265"></td><td><input type="number" value="520"></td><td><input type="number" value="1280"></td></tr>
            <tr><td class="name-col">Master Aroma</td><td><input type="number" value="55"></td><td><input type="number" value="270"></td><td><input type="number" value="530"></td><td><input type="number" value="1300"></td></tr>
            <tr><td class="name-col">Sinandomeng</td><td><input type="number" value="50"></td><td><input type="number" value="240"></td><td><input type="number" value="470"></td><td><input type="number" value="1150"></td></tr>
            <tr><td class="name-col">Jasmine</td><td><input type="number" value="52"></td><td><input type="number" value="250"></td><td><input type="number" value="490"></td><td><input type="number" value="1200"></td></tr>
            <tr><td class="name-col">Dinorado</td><td><input type="number" value="60"></td><td><input type="number" value="290"></td><td><input type="number" value="570"></td><td><input type="number" value="1400"></td></tr>
        </tbody>
    </table>
</div>

<button class="btn-download" onclick="downloadImage()">Bild herunterladen</button>

<script>
    function downloadImage() {
        html2canvas(document.querySelector("#capture")).then(canvas => {
            const link = document.createElement('a');
            link.download = 'preistafel_bigas.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>
</body>
</html>
