<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presyo ng Bigas - Interaktive Preistafel</title>
    <style>
        body {
            background-color: #2c2c2c;
            font-family: 'Courier New', Courier, monospace;
            color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .chalkboard-frame {
            border: 16px solid #5c3a21;
            background-color: #1e2a22;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            max-width: 950px;
            width: 100%;
            border-radius: 4px;
        }
        h1 {
            text-align: center;
            font-size: 1.6rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-bottom: 2px dashed #f4f4f4;
            padding-bottom: 10px;
            text-transform: uppercase;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            vertical-align: middle;
        }
        th {
            font-size: 1rem;
            color: #d4af37;
            text-align: center;
        }
        th:first-child, td:first-child {
            text-align: left;
        }
        input.text-input {
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.3);
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            width: 95%;
            padding: 3px;
            border-radius: 3px;
        }
        input.tagalog-input {
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            color: #bbb;
            font-family: inherit;
            font-size: 0.8rem;
            width: 95%;
            padding: 2px;
            margin-top: 4px;
            border-radius: 3px;
        }
        input.price-input {
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.5);
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            width: 70px;
            padding: 4px;
            text-align: center;
            border-radius: 3px;
        }
        input.text-input:focus, input.tagalog-input:focus, input.price-input:focus {
            outline: none;
            border-color: #d4af37;
            background: rgba(255, 255, 255, 0.1);
        }
        .calculated-price {
            text-align: center;
            color: #a8d5ba;
            font-weight: bold;
        }
        .info {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="chalkboard-frame">
    <h1>Presyo: Mga Uri at Presyo ng Bigas</h1>
    <table>
        <thead>
            <tr>
                <th>Uri ng Bigas</th>
                <th>25 kg (Basis)</th>
                <th>1 kg</th>
                <th>5 kg</th>
                <th>10 kg</th>
            </tr>
        </thead>
        <tbody id="rice-table-body">
            <!-- Wird via JS geladen -->
        </tbody>
    </table>
    <div class="info">Namen, Eigenschaften und Preise sind direkt editierbar und werden automatisch gespeichert.</div>
</div>

<script>
    const defaultData = [
        { name: "1. Fuji", tagalog: "Puti", p25: 1420 },
        { name: "2. Perfect", tagalog: "Perpekto", p25: 1340 },
        { name: "3. Master Aroma", tagalog: "Mabangong Bigas", p25: 1380 },
        { name: "4. Sweet Hasmin", tagalog: "Matamis na Jasmin", p25: 1350 },
        { name: "5. Coco pandan", tagalog: "Kusot Pandan", p25: 1330 },
        { name: "6. Jasmine original", tagalog: "Jasmin Orihinal", p25: 1310 },
        { name: "7. Master Alsa", tagalog: "Alsa Hari", p25: 1200 },
        { name: "8. Malagkit", tagalog: "Malagkit", p25: 1500 }
    ];

    let riceData = JSON.parse(localStorage.getItem('ricePricesCustom')) || defaultData;
    const tbody = document.getElementById("rice-table-body");

    function renderTable() {
        tbody.innerHTML = "";
        riceData.forEach((item, index) => {
            let p1 = Math.round(item.p25 / 25);
            let p5 = Math.round(item.p25 * (5 / 25));
            let p10 = Math.round(item.p25 * (10 / 25));

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>
                    <input type="text" class="text-input" value="${item.name}" data-index="${index}" data-field="name">
                    <input type="text" class="tagalog-input" value="${item.tagalog || ''}" placeholder="Eigenschaft (optional)" data-index="${index}" data-field="tagalog">
                </td>
                <td style="text-align:center;">₱<input type="number" class="price-input" value="${item.p25}" data-index="${index}" data-field="p25"></td>
                <td class="calculated-price">₱${p1}</td>
                <td class="calculated-price">₱${p5}</td>
                <td class="calculated-price">₱${p10}</td>
            `;
            tbody.appendChild(row);
        });

        // Event Listener für alle Inputs (Name, Tagalog, Preis)
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', (e) => {
                const idx = e.target.getAttribute('data-index');
                const field = e.target.getAttribute('data-field');
                
                if (field === 'p25') {
                    riceData[idx].p25 = parseFloat(e.target.value) || 0;
                    // Berechnete Spalten in der Zeile direkt anpassen ohne Neuladen der ganzen Tabelle
                    const row = e.target.closest('tr');
                    const val = riceData[idx].p25;
                    row.cells[2].innerText = `₱${Math.round(val / 25)}`;
                    row.cells[3].innerText = `₱${Math.round(val * (5 / 25))}`;
                    row.cells[4].innerText = `₱${Math.round(val * (10 / 25))}`;
                } else if (field === 'name') {
                    riceData[idx].name = e.target.value;
                } else if (field === 'tagalog') {
                    riceData[idx].tagalog = e.target.value;
                }

                // In localStorage sichern
                localStorage.setItem('ricePricesCustom', JSON.stringify(riceData));
            });
        });
    }

    renderTable();
</script>

</body>
</html>
