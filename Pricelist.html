<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preistafel Bigas - Facebook Optimiert</title>
    <!-- html2canvas Bibliothek -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        
        /* Wrapper für mobile Ansicht (verhindert Ränder-Ausbruch) */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            display: flex;
            justify-content: center;
        }

        .board {
            background-color: #1a1a1a;
            border: 4px solid #8B4513;
            padding: 20px;
            border-radius: 8px;
            width: 550px; /* Feste Breite für ein perfektes Facebook-Bildformat */
            box-sizing: border-box;
        }
        h1 { 
            text-align: center; 
            color: #f1c40f; 
            border-bottom: 2px dashed #f1c40f; 
            padding-bottom: 10px; 
            letter-spacing: 2px;
            margin-top: 0;
            font-size: 1.5em;
        }
        table { 
            border-collapse: collapse; 
            margin-top: 15px; 
            width: 100%; 
        }
        th, td { 
            border: 1px solid #333; 
            padding: 8px; 
            text-align: center; 
            font-size: 0.95em;
        }
        th { 
            color: #f1c40f; 
        }
        input {
            width: 60px;
            background: #2c2c2c;
            color: white;
            border: 1px solid #555;
            text-align: center;
            display: block;
            margin: 0 auto;
            font-size: 1em;
            padding: 4px;
            border-radius: 4px;
        }
        /* Pfeile bei Zahlenfeldern entfernen */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        .per-kg { 
            font-size: 0.75em; 
            color: #aaa; 
            margin-top: 4px; 
            display: block; 
        }
        .btn-container {
            margin-top: 20px;
            text-align: center;
            width: 100%;
        }
        button {
            background-color: #f1c40f;
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover {
            background-color: #d4ac0d;
        }
    </style>
</head>
<body>

<div class="table-responsive">
    <div class="board" id="capture">
        <h1>PRESYO NG BIGAS</h1>
        <table id="price-table">
            <tr>
                <th>Sorte</th>
                <th>1kg</th>
                <th>5kg</th>
                <th>10kg</th>
                <th>25kg</th>
            </tr>
        </table>
    </div>
</div>

<div class="btn-container">
    <button onclick="downloadImage()">Als Bild für Facebook speichern</button>
</div>

<script>
    const data = [
        {name: "Fuji", prices: [57, 280, 550, 1350]},
        {name: "Perfect", prices: [54, 265, 520, 1280]},
        {name: "Master Aroma", prices: [55, 270, 530, 1300]},
        {name: "Sinandomeng", prices: [50, 240, 470, 1150]},
        {name: "Jasmine", prices: [52, 250, 490, 1200]},
        {name: "Dinorado", prices: [60, 290, 570, 1400]}
    ];
    const weights = [1, 5, 10, 25];
    const table = document.getElementById('price-table');

    data.forEach(row => {
        let tr = document.createElement('tr');
        tr.innerHTML = `<td style="text-align: left; font-weight: bold;">${row.name}</td>`;
        row.prices.forEach((p, i) => {
            tr.innerHTML += `<td>
                <input type="number" value="${p}" oninput="calc(this, ${weights[i]})">
                <span class="per-kg">(${(p/weights[i]).toFixed(2)} / kg)</span>
            </td>`;
        });
        table.appendChild(tr);
    });

    function calc(el, weight) {
        let val = parseFloat(el.value) || 0;
        el.nextElementSibling.innerText = "(" + (val / weight).toFixed(2) + " / kg)";
    }

    function downloadImage() {
        const board = document.getElementById('capture');
        html2canvas(board, { 
            backgroundColor: '#1a1a1a',
            scale: 2 // Erhöht die Auflösung für ein gestochen scharfes Facebook-Bild
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'preistafel_bigas_facebook.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>

</body>
</html>
