<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Preistafel Bigas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #2b2b2b;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
        }
        .chalkboard {
            background-color: #1a221e;
            color: #f2f2f2;
            border: 12px solid #5c3a21;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            width: 450px; /* Hochformat Breite */
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 20px; text-transform: uppercase; border-bottom: 1px dashed #fff; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid rgba(255,255,255,0.2); padding: 6px; }
        input { background: transparent; color: #fff; border: 1px solid #777; width: 45px; text-align: center; font-family: inherit; }
        button { margin-top: 20px; padding: 10px 20px; background-color: #5c3a21; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chalkboard" id="capture">
        <h2>Presyo ng Bigas</h2>
        <table>
            <thead>
                <tr><th>Uri</th><th>1kg</th><th>5kg</th><th>10kg</th></tr>
            </thead>
            <tbody>
                <!-- 6 Sorten -->
                <tr><td>Fuji</td><td><input type="number" value="57"></td><td><input type="number" value="284"></td><td><input type="number" value="568"></td></tr>
                <tr><td>Perfect</td><td><input type="number" value="54"></td><td><input type="number" value="268"></td><td><input type="number" value="535"></td></tr>
                <tr><td>Master Aroma</td><td><input type="number" value="55"></td><td><input type="number" value="276"></td><td><input type="number" value="550"></td></tr>
                <tr><td>Sinandomeng</td><td><input type="number" value="50"></td><td><input type="number" value="245"></td><td><input type="number" value="490"></td></tr>
                <tr><td>Jasmine</td><td><input type="number" value="52"></td><td><input type="number" value="255"></td><td><input type="number" value="510"></td></tr>
                <tr><td>Dinorado</td><td><input type="number" value="60"></td><td><input type="number" value="295"></td><td><input type="number" value="590"></td></tr>
            </tbody>
        </table>
    </div>
    <button onclick="downloadImage()">Bild herunterladen (Hochformat)</button>

    <script>
        function downloadImage() {
            html2canvas(document.querySelector("#capture")).then(canvas => {
                const link = document.createElement('a');
                link.download = 'preistafel_hochformat.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
