<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Preistafel Bigas</title>
    <!-- Bibliothek für Bild-Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #2b2b2b;
            display: flex;
            justify-content: center;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
        }
        .chalkboard {
            background-color: #1a221e;
            color: #f2f2f2;
            border: 16px solid #5c3a21;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            width: 750px;
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 22px; letter-spacing: 2px; border-bottom: 2px dashed rgba(242, 242, 242, 0.4); padding-bottom: 15px; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid rgba(242, 242, 242, 0.25); padding: 8px 10px; text-align: left; }
        th { text-align: center; font-weight: bold; }
        td:nth-child(2), td:nth-child(3), td:nth-child(4), td:nth-child(5) { text-align: center; }
        
        /* Eingabefelder Design */
        input {
            background: transparent;
            color: #fff;
            border: 1px solid #555;
            width: 60px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
        }
        input:focus { outline: none; border-color: #fff; }
        
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #5c3a21;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #7a4d2c; }
        .subtext { display: block; font-size: 13px; opacity: 0.8; margin-top: 2px; }
    </style>
</head>
<body>
    <div class="chalkboard" id="capture">
        <h2>Presyo: Mga Uri Presyo ng Bigas</h2>
        <table>
            <thead>
                <tr>
                    <th>Uri ng Bigas</th>
                    <th>1 kg</th>
                    <th>5 kg</th>
                    <th>10 kg</th>
                    <th>25 kg</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1. Fuji <span class="subtext">(Puti)</span></td>
                    <td>₱<input type="number" value="57"></td>
                    <td>₱<input type="number" value="284"></td>
                    <td>₱<input type="number" value="568"></td>
                    <td>₱<input type="number" value="1420"></td>
                </tr>
                <tr>
                    <td>2. Perfect <span class="subtext">(Perpekto)</span></td>
                    <td>₱<input type="number" value="54"></td>
                    <td>₱<input type="number" value="268"></td>
                    <td>₱<input type="number" value="535"></td>
                    <td>₱<input type="number" value="1340"></td>
                </tr>
                <tr>
                    <td>3. Master Aroma <span class="subtext">(Mabangong Bigas)</span></td>
                    <td>₱<input type="number" value="55"></td>
                    <td>₱<input type="number" value="276"></td>
                    <td>₱<input type="number" value="550"></td>
                    <td>₱<input type="number" value="1380"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <button onclick="downloadImage()">Bild herunterladen</button>

    <script>
        function downloadImage() {
            html2canvas(document.querySelector("#capture")).then(canvas => {
                const link = document.createElement('a');
                link.download = 'preistafel.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
