<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Post-Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
        /* Das Raster-Layout */
        #grid-container {
            display: grid;
            grid-template-columns: repeat(2, 300px);
            gap: 20px;
            background: white;
            padding: 20px;
            width: fit-content;
        }
        .card { border: 1px solid #ccc; padding: 10px; width: 280px; text-align: center; }
        .card img { max-width: 100%; height: 200px; object-fit: cover; background: #eee; }
        
        /* Editier-Bereich */
        .controls { margin-top: 20px; border-top: 2px solid #333; padding-top: 20px; }
        input { width: 90%; margin-bottom: 5px; }
    </style>
</head>
<body>

<h1>Dein Post-Generator</h1>

<!-- Das zu exportierende Raster -->
<div id="grid-container">
    <!-- Kachel 1 -->
    <div class="card" id="card1">
        <img id="img1" src="" alt="Bild 1">
        <h3 id="title1">Titel 1</h3>
        <p id="price1">Preis 1</p>
    </div>
    <!-- Kachel 2 -->
    <div class="card" id="card2">
        <img id="img2" src="" alt="Bild 2">
        <h3 id="title2">Titel 2</h3>
        <p id="price2">Preis 2</p>
    </div>
</div>

<!-- Bearbeitungs-Bereich -->
<div class="controls">
    <h3>Kachel 1 bearbeiten:</h3>
    <input type="file" onchange="loadFile(event, 'img1')">
    <input type="text" placeholder="Titel" oninput="document.getElementById('title1').innerText = this.value">
    <input type="text" placeholder="Preis" oninput="document.getElementById('price1').innerText = this.value">
    
    <br><br>
    <button onclick="downloadImage()">Bild herunterladen (für Facebook)</button>
</div>

<script>
    // Bild-Upload Funktion
    function loadFile(event, imgId) {
        var reader = new FileReader();
        reader.onload = function() {
            document.getElementById(imgId).src = reader.result;
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    // Export-Funktion
    function downloadImage() {
        html2canvas(document.querySelector("#grid-container")).then(canvas => {
            let link = document.createElement("a");
            link.download = "mein-facebook-post.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }
</script>

</body>
</html>
